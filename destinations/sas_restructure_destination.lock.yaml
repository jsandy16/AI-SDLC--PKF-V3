        copy failed: …\" and the source is not touched.\n4. It checks the target with `head_object` and compares its size
        to the listed size. A failure gives \"target check failed: …\" and the source is kept.\n5. It then deletes the source.
        A failure gives \"copied but source delete failed: …\". If the bucket keeps versions, the detail notes the delete
        marker.\n6. Unless the file went to error/, it checks the path with `tag_value_valid` and replaces the target's tags
        with `ADDITIONAL_TAG` = the path. If tagging fails, or the value isn't allowed, the code logs a warning, adds a note
