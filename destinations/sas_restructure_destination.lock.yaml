# destinations/sas_restructure_destination.lock.yaml — plan, step tests, simulation and code tests.
# Written by `pkf plan/code/test` and `pkf create`. Do not edit by hand.
lock_version: 2
kind: destination
name: sas_restructure_destination
requirement_sha256: bbe2889b220853aa6a8c1730fb5f8cffe0a848e5d33587f007dc097da25df276
plan:
  summary: 'Moves each incoming SAS file (one file per package, package path = its path below incoming/) to a target key in
    the same bucket. The target comes from the folder path through seven rules (CDAP, IDAP, MED, ANON, CDAR, OTHERS, DEFAULT),
    and exactly one rule must match. If no rule matches, several rules match, or the target cannot be worked out, the file
    goes to error/<path>. Delivery is a server-side move: copy, check the target, delete the source. Files that reach their
    real target (not error/) then get their tags replaced with ADDITIONAL_TAG = the original path.'
  why: Neither `prefix` nor `route` can build keys from path segments (study, data format, last folder, the reporting 
    level after 'ar'), check that exactly one rule matches, or fall back to an error/ prefix. So one custom step 
    computes every key, using small pure helpers for each decision. The framework's upload cannot move files, replace 
    tags or treat a tagging failure as a warning, so the plan ends with one custom_delivery step. That step gets each 
    transfer with its computed target_key. It calls the same pure decide_target helper again to get the rule or error 
    reason for the report line and to know whether to skip tagging.
  steps:
    - id: restructure_keys
      op: custom
      title: Work out each file's target folder from its folder path using the CDAP/IDAP/MED/ANON/CDAR/OTHERS/DEFAULT 
        rules, or error/ when no single rule gives a target
      params:
        function: restructure_keys
      pseudocode: "1. For each path in layout['files'] whose layout['keys'].get(path) is not set:\n2.   key, rule, reason
        = decide_target(path)\n3.   layout['keys'][path] = key\n4.   log one line: source=incoming/<path>, target=key, rule=rule
        or error reason=reason\n5. Return layout.\n(Never sets None: no file is dropped. Only raises ValueError when even
        the error/ key is longer than 1,024 bytes.)"
      unit:
        requires: layout['files'] holds the package path of the one file (path relative to incoming/, first segment = 
          study ID); no keys set yet.
        guarantees: "layout['keys'][path] is set for every file: either the rule target or 'error/' + path. No key is None.
          layout['files'] is unchanged."
        clauses:
          - R-DST-1
          - R-DST-2
          - R-DST-3
          - R-DST-4
          - R-DST-5
          - R-DST-6
          - R-DST-7
          - R-DST-8
          - R-DST-9
          - R-DST-10
          - R-DST-11
          - R-DST-12
          - R-DST-13
          - R-DST-14
          - R-DST-15
          - R-DST-16
          - R-DST-17
          - R-DST-18
          - R-DST-19
          - R-DST-20
          - R-DST-21
          - R-DST-22
          - R-DST-23
          - R-RUN-2
        reason: '`route` matches globs/regex to one key template. It cannot pull study, format, last folder or reporting level
          out of the path into the key, cannot check that exactly one of several rules matches, and cannot send uncomputable
          targets to error/.'
        edge_cases:
          - NAM-BAD-CHARS
          - NAM-KEY-LENGTH
          - "REQ-1: file directly under the study folder (folder path '/<study>/') -> DEFAULT pass-through"
          - 'REQ-2: path with /data_reuse/ but no data format -> no rule matches -> error/'
          - "REQ-3: path matching two rules (e.g. /data_reuse/ + /cdap_ + /cdar/) -> error/ with reason 'several rules matched:
            CDAP, CDAR'"
          - "REQ-4: CDAR with 'ar' as the last folder (no reporting level) -> error/"
          - 'REQ-5: CDAR reporting level adam/sdtm/raw (any case) -> error/'
          - "REQ-6: CDAP interim last folder with fewer than 3 '_' parts, or other with fewer than 2 -> error/"
          - 'REQ-7: ANON _restricted_raw_ -> format raw'
          - "REQ-8: ANON last part 'IA500' (uppercase) -> other/IA500, not interim"
          - "REQ-9: 'Ar' / 'AR' folder is recognised as 'ar'"
        functions:
          - name: folder_path
            signature: 'def folder_path(path: str) -> str'
            purpose: Returns the folder part of a package path with '/' at both ends, used for all pattern matching.
            pseudocode: "1. d = posixpath.dirname(path)\n2. return '/' + d + '/' if d else '/'"
          - name: slash_format
            signature: 'def slash_format(folder: str) -> str | None'
            purpose: Works out the slash data format of a wrapped folder path.
            pseudocode: "1. if '/adam/' in folder: return 'adam'\n2. if '/sdtm/' in folder: return 'sdtm'\n3. if 'raw/' in
              folder: return 'raw'  (so restricted_raw/ counts)\n4. return None"
          - name: underscore_format
            signature: 'def underscore_format(folder: str) -> str | None'
            purpose: Works out the underscore data format used by anonymised folders.
            pseudocode: "1. if '_adam_' in folder: return 'adam'\n2. if '_sdtm_' in folder: return 'sdtm'\n3. if '_raw_' in
              folder or '_restricted_raw_' in folder: return 'raw'\n4. return None"
          - name: matching_rules
            signature: 'def matching_rules(folder: str) -> list[str]'
            purpose: Checks every rule against the wrapped folder path and returns the names of all that match, in rule 
              order.
            pseudocode: "1. sf = slash_format(folder); uf = underscore_format(folder); dr = '/data_reuse/' in folder\n2. m
              = []\n3. if dr and '/cdap_' in folder and sf: m.append('CDAP')\n4. if dr and '/idap' in folder and sf: m.append('IDAP')\n\
              5. if dr and '/med' in folder and sf: m.append('MED')\n6. if '_anon_' in folder and uf: m.append('ANON')\n7.
              if '/cdar/' in folder and sf: m.append('CDAR')\n8. if dr and sf and none of ['/med','/cdap','/idap','/anon','_anon_']
              in folder: m.append('OTHERS')\n9. if none of ['/data_reuse/','_anon_','/cdar/'] in folder: m.append('DEFAULT')\n\
              10. return m"
          - name: ia_label
            signature: 'def ia_label(text: str) -> str'
            purpose: Turns an interim marker like ia300, ia1 or ia_psc into ia_300, ia_1, ia_psc.
            pseudocode: "1. rest = text[2:] if text.lower().startswith('ia') else text\n2. rest = rest.lstrip('_')\n3. return
              'ia_' + rest"
          - name: target_cdap
            signature: 'def target_cdap(study: str, folder: str, last: str, fmt: str, file: str) -> str'
            purpose: Builds the CDAP target; raises ValueError when the last folder has too few '_' parts.
            pseudocode: "1. if '/cdap_csr' in folder: return f'{study}/extended_primary_use/primary/{fmt}/{file}'\n2. parts
              = last.split('_')\n3. if '_ia' in last: if len(parts) < 3: raise ValueError('CDAP interim: last folder has fewer
              than 3 _ parts'); return f'{study}/extended_primary_use/interim/{fmt}/{ia_label(parts[2])}/{file}'\n4. if len(parts)
              < 2: raise ValueError('CDAP other: last folder has fewer than 2 _ parts')\n5. return f'{study}/extended_primary_use/other/{fmt}/{parts[1]}/{file}'"
          - name: target_anon
            signature: 'def target_anon(study: str, folder: str, last: str, fmt: str, file: str) -> str'
            purpose: Builds the ANON target from _anon_csr or the last '_' part of the last folder.
            pseudocode: "1. if '_anon_csr' in folder: return f'{study}/anonymised/primary/{fmt}/{file}'\n2. part = last.split('_')[-1]\n\
              3. if part == '': raise ValueError('ANON: empty last _ part')\n4. if part.startswith('ia') (case-sensitive):
              return f'{study}/anonymised/interim/{fmt}/{ia_label(part)}/{file}'\n5. return f'{study}/anonymised/other/{fmt}/{part}/{file}'"
          - name: target_cdar
            signature: 'def target_cdar(study: str, folder: str, fmt: str, file: str) -> str'
            purpose: Builds the CDAR target from the reporting level after the 'ar' folder; raises ValueError when there
              is no level or it is a data format.
            pseudocode: "1. segs = [s for s in folder.split('/') if s]\n2. i = index of the first s with s.lower() == 'ar';
              none -> raise ValueError('CDAR: no ar folder')\n3. if i+1 >= len(segs): raise ValueError('CDAR: no reporting
              level after ar')\n4. level = segs[i+1]; low = level.lower()\n5. if low in ('adam','sdtm','raw'): raise ValueError(f'CDAR:
              reporting level {level} is a data format')\n6. if low == 'csr': return f'{study}/primary/complete/{fmt}/{file}'\n\
              7. if low.startswith('ia'): return f'{study}/primary/interim/{fmt}/{ia_label(level)}/{file}'\n8. return f'{study}/primary/other/{fmt}/{level}/{file}'"
          - name: decide_target
            signature: 'def decide_target(path: str) -> tuple[str, str, str]'
            purpose: Returns (key, rule, reason) for one package path. A failure returns the error/ key with an empty 
              rule and the reason.
            pseudocode: "1. folder = folder_path(path); file = posixpath.basename(path); study = path.split('/')[0]; last
              = folder.strip('/').split('/')[-1]; err = 'error/' + path\n2. m = matching_rules(folder)\n3. if len(m) == 0:
              return err, '', 'no rule matched'\n4. if len(m) > 1: return err, '', 'several rules matched: ' + ', '.join(m)\n\
              5. r = m[0]; sf = slash_format(folder); uf = underscore_format(folder)\n6. try: CDAP -> target_cdap(study, folder,
              last, sf, file); IDAP -> f'{study}/internal_reuse/{sf}/{last}/{file}'; MED -> f'{study}/external_reuse/{sf}/{last}/{file}';
              ANON -> target_anon(study, folder, last, uf, file); CDAR -> target_cdar(study, folder, sf, file); OTHERS ->
              f'{study}/other/{sf}/{last}/{file}'; DEFAULT -> path\n7. except ValueError as e: return err, '', f'{r}: {e}'\
              \  (a matched rule that cannot compute its target counts as a match)\n8. if len(key.encode('utf-8')) > 1024:
              return err, '', f'{r}: target key longer than 1024 bytes'\n9. if len(err.encode('utf-8')) > 1024 at step 3/4/7/8:
              raise ValueError(f'error key longer than 1024 bytes: {path}')\n10. return key, r, ''"
    - id: move_and_tag
      op: custom_delivery
      title: Move each file server-side to its target (copy, check, delete the source), then replace its tags with 
        ADDITIONAL_TAG unless it went to error/
      params:
        function: move_and_tag
      pseudocode: "For each transfer t (one failing never stops the others):\n1. key, rule, reason = decide_target(t['path']);
        to_error = (rule == '')\n2. extra = {}; if t['etag']: extra['CopySourceIfMatch'] = t['etag']; d = ctx['delivery'];
        if d.get('server_side_encryption'): extra['ServerSideEncryption'] = it; if d.get('kms_key_id'): extra['SSEKMSKeyId']
        = it\n3. try aws.s3_destination.copy({'Bucket': t['source_bucket'], 'Key': t['source_key']}, t['target_bucket'], t['target_key'],
        ExtraArgs=extra, SourceClient=aws.s3_source) (managed multipart copy, works above 5 GiB; an existing target is overwritten).
        except Exception as e: result failed, detail 'copy failed: <e>'; source left; log; continue\n4. try head = aws.s3_destination.head_object(Bucket=target_bucket,
        Key=target_key); if head['ContentLength'] != t['size']: raise. except: result failed, detail 'target check failed:
        <reason>'; source left; continue\n5. try resp = aws.s3_source.delete_object(Bucket=source_bucket, Key=source_key).
        except Exception as e: result failed, detail 'copied but source delete failed: <e>'; continue. If resp has DeleteMarker/VersionId:
        add 'delete marker <VersionId>' to the detail\n6. if not to_error: value = t['path']; if tag_value_valid(value): try
        aws.s3_destination.put_object_tagging(Bucket=target_bucket, Key=target_key, Tagging={'TagSet': [{'Key': 'ADDITIONAL_TAG',
        'Value': value}]}) except Exception as e: aws.log.warning(...); detail += ' tagging failed (warning): <e>'. else:
        aws.log.warning('tag value not allowed'); detail += ' tag skipped (warning)'\n7. status = 'moved_to_error' if to_error
        else 'moved'; detail = f'rule {rule}' or f'error: {reason}' plus any notes\n8. aws.log.info one line: source=s3://source_bucket/source_key
        target=target_key status rule/reason\n9. Append {'path': t['path'], 'key': t['target_key'], 'status': status, 'detail':
        detail}\nReturn the results (exactly one per transfer)."
      unit:
        requires: Every file has a target_key from restructure_keys (rule target or error/<path>). Source and 
          destination are S3, in the same bucket. No transformation.
        guarantees: Each delivered file sits at its target key and its source in incoming/ is gone. Rule-placed targets 
          carry exactly one tag, ADDITIONAL_TAG = package path. Targets under error/ keep their tags as copied. Failed 
          copies, checks or deletes return status 'failed' and leave the source in incoming/. Each result has a detail 
          with the rule or error reason.
        clauses:
          - R-AFT-1
          - R-AFT-2
          - R-AFT-3
          - R-AFT-4
          - R-AFT-5
          - R-AFT-6
          - R-RUN-1
          - R-RUN-2
          - R-RUN-3
        reason: The framework's upload cannot delete the source after copying (a move), cannot replace object tags after
          delivery, and cannot treat a tagging failure as a warning.
        edge_cases:
          - DEL-OVERWRITE
          - DEL-LARGE-COPY
          - DEL-PARTIAL
          - DEL-IDEMPOTENT
          - DEL-SSE
          - DEL-VERSIONED
          - DEL-TAGS
          - DEL-VERIFY
          - 'REQ-10: copy fails with PreconditionFailed (source changed since listing) -> failed, source left'
          - 'REQ-11: delete fails after a good copy -> failed (run fails), target stays and the retry overwrites it'
          - 'REQ-12: file moved to error/ -> status moved_to_error, no tagging call, does not fail the run'
        functions:
          - name: tag_value_valid
            signature: 'def tag_value_valid(value: str) -> bool'
            purpose: Checks that a tag value is at most 256 characters and uses only the characters S3 tags allow.
            pseudocode: "1. if len(value) > 256: return False\n2. return re.fullmatch(r\"[\\w\\s+\\-=.:/@]*\", value, re.UNICODE)
              is not None"
  assumptions:
    - The package path is already relative to incoming/, so 'path without incoming/' is the package path. The error key 
      is 'error/' + package path, and the ADDITIONAL_TAG value is the package path.
    - "'ia_ + the rest' strips a leading 'ia' (any case for CDAR, lowercase for ANON/CDAP) and then any leading '_'. If a
      CDAP third part does not start with 'ia', the whole part goes after 'ia_'."
    - CDAR uses the first folder named 'ar' (case-insensitive). The reporting level is compared in lowercase, but the 
      'other' target keeps the folder name as written (e.g. bdr200).
    - The study is the first segment of the package path, used exactly as written. The last folder is the last segment 
      of the folder path.
    - If the computed key would be longer than 1,024 bytes, the target counts as uncomputable and the file goes to 
      error/. Only an error key that is too long fails the package.
    - There are no character restrictions on keys, so the folder and file names are used unchanged (NAM-BAD-CHARS).
    - R-RUN-1 (2 retries, 2 minutes apart) is a run or DAG setting, not a step. Failed files stay in incoming/, so a 
      retry picks them up again.
    - If a tag value is longer than 256 characters or uses characters S3 does not allow, tagging is skipped with a 
      warning, the same as a tagging failure.
    - The rule or error reason for the report line is found again in the delivery step by calling the same pure 
      decide_target helper. The pass-through step logs it too.
  ambiguities:
    - The owner's fixed setting delivery_policies.if_exists is 'skip_identical', but the requirement (R-AFT-3) says an 
      existing target is overwritten. With skip_identical the framework skips an identical target before move_and_tag 
      runs, so the source is never deleted and is retried on every run. With overwrite, the file is copied and the 
      source is deleted. Should if_exists be changed to 'overwrite', or should an identical existing target count as 
      delivered while the source stays in incoming/?
  step_tests:
    restructure_keys:
      - name: cdar_csr
        purpose: CDAR with level csr goes to primary/complete
        input:
          files:
            - S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat
          vars:
            package: S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat
          keys: {}
        params: {}
        expected:
          - S-001/primary/complete/adam/a.sas7bdat
        expect_error: false
        covers:
          - R-DST-1
          - R-DST-2
          - R-DST-4
          - R-DST-15
          - R-DST-17
          - R-DST-6
          - R-RUN-2
      - name: cdar_without_ar_goes_to_error
        purpose: CDAR matched but no ar folder gives error/ key
        input:
          files:
            - S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat
          vars:
            package: x
          keys: {}
        params: {}
        expected:
          - error/S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat
        expect_error: false
        covers:
          - R-DST-16
          - R-DST-22
          - R-DST-23
      - name: cdap_interim
        purpose: CDAP interim last folder gives ia_300
        input:
          files:
            - d0000c00004/data_reuse/d000/d0000c00004/ar/shared/raw/dev/data/cdap_20210617_ia300/b.sas7bdat
          vars:
            package: x
          keys: {}
        params: {}
        expected:
          - d0000c00004/extended_primary_use/interim/raw/ia_300/b.sas7bdat
        expect_error: false
        covers:
          - R-DST-7
          - R-DST-9
          - R-DST-5
          - R-DST-2
      - name: anon_other
        purpose: ANON other uses last underscore part and raw format
        input:
          files:
            - d0000c00004/d0000c00004_raw_anon_20220120/c.sas7bdat
          vars:
            package: x
          keys: {}
        params: {}
        expected:
          - d0000c00004/anonymised/other/raw/20220120/c.sas7bdat
        expect_error: false
        covers:
          - R-DST-13
          - R-DST-14
          - R-DST-3
      - name: default_passthrough
        purpose: DEFAULT keeps the path
        input:
          files:
            - ABCD-0000-0000/Export_Inventory_2024-03-01.pdf
          vars:
            package: x
          keys: {}
        params: {}
        expected:
          - ABCD-0000-0000/Export_Inventory_2024-03-01.pdf
        expect_error: false
        covers:
          - R-DST-21
          - NAM-BAD-CHARS
      - name: several_rules_matched
        purpose: CDAP and CDAR both match so error/
        input:
          files:
            - S1/data_reuse/cdap_x/cdar/ar/csr/raw/f.txt
          vars:
            package: x
          keys: {}
        params: {}
        expected:
          - error/S1/data_reuse/cdap_x/cdar/ar/csr/raw/f.txt
        expect_error: false
        covers:
          - REQ-3
          - R-DST-6
          - R-DST-22
      - name: anon_uppercase_ia_is_other
        purpose: Uppercase IA500 is other, not interim
        input:
          files:
            - S1/S1_raw_anon_IA500/f.txt
          vars:
            package: x
          keys: {}
        params: {}
        expected:
          - S1/anonymised/other/raw/IA500/f.txt
        expect_error: false
        covers:
          - REQ-8
          - REQ-7
      - name: cdar_mixed_case_ar
        purpose: Ar folder recognised; other level; no match for data_reuse without format
        input:
          files:
            - S1/cdar/Ar/bdr200/adam/f.txt
            - S1/data_reuse/x/f.txt
            - S1/f.txt
          vars:
            package: x
          keys: {}
        params: {}
        expected:
          - S1/primary/other/adam/bdr200/f.txt
          - error/S1/data_reuse/x/f.txt
          - S1/f.txt
        expect_error: false
        covers:
          - REQ-9
          - REQ-2
          - REQ-1
          - R-DST-19
    move_and_tag:
      - name: normal_move_and_tag
        purpose: Rule-placed file is copied, source deleted, old tags replaced by ADDITIONAL_TAG=path
        input:
          objects:
            bkt-test/incoming/S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat:
              body: hello
              tags:
                old: x
          transfers:
            - path: S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat
              source_bucket: bkt-test
              source_key: incoming/S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat
              size: 5
              etag:
              target_bucket: bkt-test
              target_key: S-001/primary/complete/adam/a.sas7bdat
        params: {}
        expected:
          objects:
            - bkt-test/S-001/primary/complete/adam/a.sas7bdat
          tags:
            bkt-test/S-001/primary/complete/adam/a.sas7bdat:
              ADDITIONAL_TAG: S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat
          statuses:
            S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat: moved
        expect_error: false
        covers:
          - R-AFT-1
          - R-AFT-4
          - R-RUN-2
          - R-RUN-3
          - DEL-TAGS
          - DEL-VERIFY
      - name: error_target_no_tag_change
        purpose: File sent to error/ is moved, status moved_to_error, tags left as copied
        input:
          objects:
            bkt-test/incoming/S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat:
              body: abc
              tags:
                k: v
          transfers:
            - path: S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat
              source_bucket: bkt-test
              source_key: incoming/S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat
              size: 3
              etag:
              target_bucket: bkt-test
              target_key: error/S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat
        params: {}
        expected:
          objects:
            - bkt-test/error/S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat
          tags:
            bkt-test/error/S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat:
              k: v
          statuses:
            S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat: moved_to_error
        expect_error: false
        covers:
          - R-AFT-6
          - R-RUN-3
          - R-RUN-2
          - 'REQ-12: file moved to error/ -> status moved_to_error, no tagging call, does not fail the run'
      - name: copy_fails_source_left
        purpose: Copy failure (e.g. precondition) gives failed and leaves source, no target
        input:
          objects:
            bkt-test/incoming/ABCD-0000-0000/f.pdf: data
          transfers:
            - path: ABCD-0000-0000/f.pdf
              source_bucket: bkt-test
              source_key: incoming/ABCD-0000-0000/f.pdf
              size: 4
              etag:
              target_bucket: bkt-test
              target_key: ABCD-0000-0000/f.pdf
          fail_calls:
            - operation: CopyObject
              key: ABCD-0000-0000/f.pdf
        params: {}
        expected:
          objects:
            - bkt-test/incoming/ABCD-0000-0000/f.pdf
          tags: {}
          statuses:
            ABCD-0000-0000/f.pdf: failed
        expect_error: false
        covers:
          - R-AFT-2
          - R-RUN-3
          - 'REQ-10: copy fails with PreconditionFailed (source changed since listing) -> failed, source left'
          - DEL-LARGE-COPY
      - name: head_check_fails_source_left
        purpose: Target check failure gives failed and the source is not deleted
        input:
          objects:
            bkt-test/incoming/ABCD-0000-0000/f.pdf: data
          transfers:
            - path: ABCD-0000-0000/f.pdf
              source_bucket: bkt-test
              source_key: incoming/ABCD-0000-0000/f.pdf
              size: 4
              etag:
              target_bucket: bkt-test
              target_key: ABCD-0000-0000/f.pdf
