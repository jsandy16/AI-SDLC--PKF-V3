  clauses:
    - id: R-RUN-1
      component: run
      text: A failed run is retried 2 times with a 2 minute delay.
      source_quote: "retries: 2\nretry_delay_minutes: 2"
      kind: stated
    - id: R-DST-1
      component: destination
      text: The target is decided from the folder path only; the file name is always kept.
      source_quote: Decide the target using the folder path only (the path without the file name). The file name is 
        always kept.
      kind: stated
    - id: R-DST-2
      component: destination
      text: 'Slash format: adam if /adam/, else sdtm if /sdtm/, else raw if raw/ (restricted_raw/ counts as raw).'
      source_quote: adam if it contains /adam/, otherwise sdtm if it contains /sdtm/, otherwise raw if it contains raw/
      kind: stated
    - id: R-DST-3
      component: destination
      text: Underscore format for anonymised folders comes from _adam_, _sdtm_, _raw_ or _restricted_raw_ (= raw).
      source_quote: For anonymised folders the data format comes from _adam_, _sdtm_, _raw_ or _restricted_raw_ (= raw).
      kind: stated
    - id: R-DST-4
      component: destination
      text: Patterns are matched against the folder path with '/' added at both ends.
      source_quote: ''
      kind: assumed
    - id: R-DST-5
      component: destination
      text: Last folder is the folder that directly contains the file.
      source_quote: '"Last folder" = the folder that directly contains the file.'
      kind: stated
    - id: R-DST-6
      component: destination
      text: Every rule is checked and exactly one must match.
      source_quote: Check every rule below. Exactly one rule must match.
      kind: stated
    - id: R-DST-7
      component: destination
      text: CDAP matches when the path contains /data_reuse/, /cdap_ and a data format.
      source_quote: 'CDAP: path contains /data_reuse/ and /cdap_ and a data format.'
      kind: stated
    - id: R-DST-8
      component: destination
      text: CDAP with /cdap_csr goes to {study}/extended_primary_use/primary/{format}/{file}.
      source_quote: contains /cdap_csr → {study}/extended_primary_use/primary/{format}/{file}
      kind: stated
    - id: R-DST-9
      component: destination
      text: CDAP with _ia in the last folder goes to {study}/extended_primary_use/interim/{format}/ia_<rest of third '_'
        part>/{file}; fewer than 3 parts is an error.
      source_quote: else if the last folder contains _ia → take the third "_" part of the last folder 
        (cdap_20210617_ia300 → ia300) and write it as ia_ + the rest (ia_300)
      kind: stated
    - id: R-DST-10
      component: destination
      text: Other CDAP goes to {study}/extended_primary_use/other/{format}/{second '_' part of last folder}/{file}; 
        fewer than 2 parts is an error.
      source_quote: else → second "_" part of the last folder (cdap_20210617 → 20210617)
      kind: stated
    - id: R-DST-11
      component: destination
      text: 'IDAP: /data_reuse/ and /idap and a data format go to {study}/internal_reuse/{format}/{last folder}/{file}.'
      source_quote: 'IDAP: path contains /data_reuse/ and /idap and a data format → {study}/internal_reuse/{format}/{last
        folder}/{file}'
      kind: stated
    - id: R-DST-12
      component: destination
      text: 'MED: /data_reuse/ and /med and a data format go to {study}/external_reuse/{format}/{last folder}/{file}.'
      source_quote: 'MED: path contains /data_reuse/ and /med and a data format → {study}/external_reuse/{format}/{last folder}/{file}'
      kind: stated
    - id: R-DST-13
      component: destination
      text: ANON matches when the path contains _anon_ and an underscore format; _anon_csr goes to 
        {study}/anonymised/primary/{format}/{file}.
      source_quote: "ANON: path contains _anon_ and an underscore data format.\n       - contains _anon_csr → {study}/anonymised/primary/{format}/{file}"
      kind: stated
    - id: R-DST-14
      component: destination
      text: "Other ANON: last '_' part of the last folder starting with lowercase ia goes to {study}/anonymised/interim/{format}/ia_<rest>/{file},
        otherwise to {study}/anonymised/other/{format}/{part}/{file}."
      source_quote: 'take the last "_" part of the last folder: starts with lowercase ia, case-sensitive (ia500) → {study}/anonymised/interim/{format}/ia_500/{file};
        otherwise (20220120) → {study}/anonymised/other/{format}/20220120/{file}'
      kind: stated
    - id: R-DST-15
      component: destination
      text: CDAR matches when the path contains /cdar/ and a data format; reporting level is the folder after the folder
        named 'ar' (case-insensitive).
      source_quote: "CDAR: path contains /cdar/ and a data format.\n       - reporting level = the folder right after the
        folder named \"ar\" (case-insensitive, compared in lowercase)"
      kind: stated
    - id: R-DST-16
      component: destination
      text: CDAR with no 'ar' folder or a reporting level of adam, sdtm or raw is an error.
      source_quote: no "ar" folder, or the reporting level is adam, sdtm or raw → error
      kind: stated
    - id: R-DST-17
      component: destination
      text: CDAR level csr goes to {study}/primary/complete/{format}/{file}.
      source_quote: csr → {study}/primary/complete/{format}/{file}
      kind: stated
    - id: R-DST-18
      component: destination
      text: "CDAR level starting with ia: remove 'ia' and any leading '_', add 'ia_', go to {study}/primary/interim/{format}/{ia_x}/{file}."
      source_quote: starts with ia → remove "ia" and any leading "_", then add "ia_" (ia1 → ia_1, ia_psc → ia_psc)
      kind: stated
    - id: R-DST-19
      component: destination
      text: Any other CDAR level goes to {study}/primary/other/{format}/{level}/{file}.
      source_quote: anything else (bdr200) → {study}/primary/other/{format}/bdr200/{file}
      kind: stated
    - id: R-DST-20
      component: destination
      text: 'OTHERS: /data_reuse/ and a data format with none of /med, /cdap, /idap, /anon, _anon_ go to {study}/other/{format}/{last
        folder}/{file}.'
      source_quote: 'OTHERS: path contains /data_reuse/ and a data format, and none of /med, /cdap, /idap, /anon, _anon_'
      kind: stated
    - id: R-DST-21
      component: destination
      text: 'DEFAULT: a path with none of /data_reuse/, _anon_, /cdar/ keeps its path without incoming/.'
      source_quote: 'DEFAULT (pass-through): path has none of /data_reuse/, _anon_, /cdar/ → the same path (incoming/ removed)'
      kind: stated
    - id: R-DST-22
      component: destination
      text: No match, several matches or an uncomputable target sends the file to error/{path without incoming/}; no 
        file is dropped.
      source_quote: No rule matches, more than one rule matches, or the target cannot be worked out → move the file to 
        error/{path without incoming/}. Never drop a file.
      kind: stated
    - id: R-DST-23
      component: destination
      text: A matched rule that cannot compute its target counts as a match and leads to error/.
      source_quote: ''
      kind: assumed
    - id: R-AFT-1
      component: destination
      text: 'Delivery is a move: server-side copy (supporting > 5 GiB), confirm the target exists, then delete the source.'
      source_quote: 'Move, not copy: copy server-side (files can be larger than 5 GiB), confirm the target exists, then delete
        the source from incoming/.'
      kind: stated
    - id: R-AFT-2
      component: destination
      text: If the copy or check fails the source stays in incoming/ and the file fails.
      source_quote: If the copy or the check fails, leave the source in incoming/ so the next run retries it; that file 
        fails.
      kind: stated
    - id: R-AFT-3
      component: destination
      text: An existing object at the target is overwritten.
      source_quote: An existing object at the target is overwritten.
      kind: stated
    - id: R-AFT-4
      component: destination
      text: After a successful move all tags on the target are replaced with ADDITIONAL_TAG = original path without 
        incoming/.
      source_quote: 'replace all tags on the target with exactly one tag: ADDITIONAL_TAG = the original path without incoming/'
      kind: stated
    - id: R-AFT-5
      component: destination
