# destinations/sas_restructured.lock.yaml — plan, step tests, simulation, code tests and approvals.
# Written by `pkf plan/code/test/approve-…`; approvals are a person's decision. Do not edit by hand.
lock_version: 2
kind: destination
name: sas_restructured
requirement_sha256: fc19fa3941505424a40594c8b7c916b0c148f39e6a639e9d231e0cd4dd346b08
plan:
  summary: Computes each file's target key from its folder path using the seven rules. A file is routed to error/{path} 
    unless exactly one rule matches and its key can be worked out. Delivery then moves each file inside the bucket. It 
    copies server-side, checks the target, deletes the source from incoming/, and sets the single ADDITIONAL_TAG on the 
    target. Files sent to error/ get no tag change. The run fails only if a copy, check or delete fails.
  steps:
    - id: compute_target_keys
      op: custom
      title: Work out target key per file from folder path (exactly one rule, else error/)
      params:
        function: compute_target_keys
      pseudocode: "For each path in layout['files'] without a key in layout['keys']:\n1. Split path on '/'; study = first
        part; file = last part; folders = parts[1:-1]; last = folders[-1] if any else None; D = '/' + '/'.join(folders) +
        '/' (the folder path only, never the file name, so a file name can never match a rule). Matching is case-sensitive
        unless stated. error_key = 'error/' + path.\n2. fmt(D): 'adam' if '/adam/' in D, elif 'sdtm' if '/sdtm/' in D, elif
        'raw' if 'raw/' in D (so restricted_raw/ counts), else None. anon_fmt(D): 'adam' if '_adam_' in D, elif 'sdtm' if
        '_sdtm_' in D, elif 'raw' if '_raw_' in D or '_restricted_raw_' in D, else None.\n3. Evaluate every rule, collecting
        (rule, key or ERR): each rule that matches its condition counts as matched even if its key cannot be derived (then
        ERR).\n 1 CDAP: '/data_reuse/' in D and '/cdap_' in D and fmt. If '/cdap_csr' in D -> study/extended_primary_use/primary/fmt/file.
        Elif '_ia' in last: parts=last.split('_'); fewer than 3 -> ERR; p=parts[2]; if p starts with 'ia' -> 'ia_'+p[2:];
        key study/extended_primary_use/interim/fmt/<ia_x>/file. Else parts=last.split('_'); fewer than 2 -> ERR; key study/extended_primary_use/other/fmt/parts[1]/file.\n\
        \ 2 IDAP: '/data_reuse/' in D and '/idap' in D and fmt -> study/internal_reuse/fmt/last/file.\n 3 MED: '/data_reuse/'
        in D and '/med' in D and fmt -> study/external_reuse/fmt/last/file.\n 4 ANON: '_anon_' in D and anon_fmt. If '_anon_csr'
        in D -> study/anonymised/primary/anon_fmt/file. Else t=last.split('_')[-1]; if t starts with lowercase 'ia' -> 'ia_'+t[2:],
        key study/anonymised/interim/anon_fmt/<ia_x>/file; else study/anonymised/other/anon_fmt/t/file.\n 5 CDAR: '/cdar/'
        in D and fmt. Find the first folder whose lowercase equals 'ar'; none, or no folder after it -> ERR. level = next
        folder lowercased; if level in (adam, sdtm, raw) -> ERR. csr -> study/primary/complete/fmt/file. Starts with 'ia'
        -> x = level[2:] with leading '_' removed, ia_x = 'ia_'+x, key study/primary/interim/fmt/ia_x/file. Else study/primary/other/fmt/level/file
        (use the lowercased level folder).\n 6 OTHERS: '/data_reuse/' in D and fmt and none of '/med','/cdap','/idap','/anon','_anon_'
        in D -> study/other/fmt/last/file.\n 7 DEFAULT: none of '/data_reuse/', '_anon_', '/cdar/' in D -> path unchanged.\n\
        4. If exactly one rule matched and its key is not ERR, layout['keys'][path] = key (no 'incoming/' prefix; the package
        path is already relative to it). Otherwise (no match, more than one match, or ERR) layout['keys'][path] = error_key.
        Record the rule number or the error reason (no rule / multiple rules: list / cannot derive: reason) in layout['vars']
        under 'reason:'+path for the delivery report.\n5. Never set None; never drop a file. Return layout."
    - id: move_and_tag
      op: custom_delivery
      title: Move files server-side, verify, delete source, tag target
      params:
        function: move_and_tag
      pseudocode: "For each transfer t (process independently; one failure must not stop the others; return exactly one result
        dict per transfer):\n1. is_error = (t['target_key'] == 'error/' + t['path']).\n2. extra = {} ; if t['etag'] then extra['CopySourceIfMatch']
        = t['etag']; if ctx['delivery']['server_side_encryption'] set, extra['ServerSideEncryption'] = it and, if kms_key_id
        set, extra['SSEKMSKeyId'] = it. Existing target is overwritten (if_exists=overwrite), no extra check.\n3. Copy: aws.s3_destination.copy({'Bucket':
        t['source_bucket'], 'Key': t['source_key']}, t['target_bucket'], t['target_key'], ExtraArgs=extra, SourceClient=aws.s3_source)
        (server-side, multipart above 8 MiB, works above 5 GiB). On any exception -> result status 'failed', detail = error,
        source untouched, go to next transfer.\n4. Check: head_object on target bucket/key; it must exist and ContentLength
        == t['size']. Otherwise -> status 'failed', detail, source left in incoming/ (do not delete), next transfer.\n5. Delete
        the source with aws.s3_source.delete_object(source_bucket, source_key) only after step 4 succeeded. If the delete
        fails -> status 'failed' with detail (the source stays, the next run retries).\n6. If not is_error: aws.s3_destination.put_object_tagging(Bucket,
        Key=target_key, Tagging={'TagSet': [{'Key': 'ADDITIONAL_TAG', 'Value': t['path']}]}) which replaces all tags with
        exactly this one (value = original path without incoming/). A tagging exception is only logged with aws.log.warning;
        the file still counts as moved. For error files do not change tags.\n7. Result: {'path': t['path'], 'key': t['target_key'],
        'status': 'moved_to_error' if is_error else 'moved', 'detail': the rule number or error reason}.\n8. Log one line
        per file with aws.log.info: source key, target key, rule or error reason. Moves to error/ never make the run fail."
  assumptions:
    - Package paths are already relative to incoming/ (as in the examples), so error keys are 'error/' + package path 
      and the delivered keys carry no incoming/ prefix.
    - For matching, the folder path is wrapped as '/'+folders joined+'/' so that '/adam/', 'raw/' and '/cdar/' also 
      match the first or last folder; the file name is never inspected.
    - Data format priority is adam, then sdtm, then raw; the same priority applies to anonymised folders.
    - Rule 5 (CDAR) lowercases the reporting-level folder and uses that lowercased value in the key.
    - If a rule's conditions match but its key cannot be derived (for example too few '_' parts), that rule counts as 
      matched and the file goes to error/.
    - Source and target are in the same bucket (eu-north-1), so one S3 client is enough. The framework checks target 
      collisions before delivery.
    - The ia part in rule 1 is the third '_' part and must start with 'ia'. If it does not, the file goes to error/.
    - The per-file report line is written to the run log.
  ambiguities: []
  step_tests:
    compute_target_keys:
      - name: cdar_csr
        purpose: Rule 5 CDAR csr
        input:
          files:
            - d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat
          vars: {}
          keys: {}
        params: {}
        expected:
          - d0000c00004/primary/complete/adam/a.sas7bdat
        expect_error: false
      - name: cdap_interim
        purpose: Rule 1 CDAP interim with _ia part
        input:
          files:
            - d0000c00004/data_reuse/d000/d0000c00004/ar/shared/raw/dev/data/cdap_20210617_ia300/b.sas7bdat
          vars: {}
          keys: {}
        params: {}
        expected:
          - d0000c00004/extended_primary_use/interim/raw/ia_300/b.sas7bdat
        expect_error: false
      - name: cdap_csr
        purpose: Rule 1 CDAP csr branch
        input:
          files:
            - s1/data_reuse/cdap_csr/adam/f.txt
          vars: {}
          keys: {}
        params: {}
        expected:
          - s1/extended_primary_use/primary/adam/f.txt
        expect_error: false
      - name: idap_last_folder
        purpose: Rule 2 IDAP uses last folder
        input:
          files:
            - s1/data_reuse/idap1/sdtm/v1/f.txt
          vars: {}
          keys: {}
        params: {}
        expected:
          - s1/internal_reuse/sdtm/v1/f.txt
        expect_error: false
      - name: anon_interim
        purpose: Rule 4 ANON interim from last underscore part
        input:
          files:
            - s1/s1_raw_anon_ia500/f.txt
          vars: {}
          keys: {}
        params: {}
        expected:
          - s1/anonymised/interim/raw/ia_500/f.txt
        expect_error: false
      - name: cdar_no_ar_error
        purpose: Rule 5 matches but key cannot be derived (no ar folder) -> error/
        input:
          files:
            - s1/cdar/adam/f.txt
          vars: {}
          keys: {}
        params: {}
        expected:
          - error/s1/cdar/adam/f.txt
        expect_error: false
      - name: others_and_preplaced
        purpose: Rule 6 OTHERS; already placed key is left untouched
        input:
          files:
            - s1/data_reuse/raw/misc/f.txt
            - s1/x.pdf
          vars: {}
          keys:
            s1/x.pdf: custom/x.pdf
        params: {}
        expected:
          - s1/other/raw/misc/f.txt
          - custom/x.pdf
        expect_error: false
      - name: default_passthrough
        purpose: Rule 7 default pass-through
        input:
          files:
            - ABCD-0000-0000/x.pdf
          vars: {}
          keys: {}
        params: {}
        expected:
          - ABCD-0000-0000/x.pdf
        expect_error: false
    move_and_tag:
      - name: normal_move_and_tag
        purpose: Copy, check, delete source, set single ADDITIONAL_TAG
        input:
          objects:
            bkt/incoming/s/a.txt: hello
          transfers:
            - path: s/a.txt
              source_bucket: bkt
              source_key: incoming/s/a.txt
              size: 5
              etag:
              target_bucket: bkt
              target_key: s/a.txt
        params: {}
        expected:
          objects:
            - bkt/s/a.txt
          tags:
            bkt/s/a.txt:
              ADDITIONAL_TAG: s/a.txt
          statuses:
            s/a.txt: moved
        expect_error: false
      - name: error_file_moved_no_tag
        purpose: Files moved to error/ get status moved_to_error
        input:
          objects:
            bkt/incoming/s/x/a.txt: hello
          transfers:
            - path: s/x/a.txt
              source_bucket: bkt
              source_key: incoming/s/x/a.txt
              size: 5
              etag:
              target_bucket: bkt
              target_key: error/s/x/a.txt
        params: {}
        expected:
          objects:
            - bkt/error/s/x/a.txt
          statuses:
            s/x/a.txt: moved_to_error
        expect_error: false
      - name: copy_fails_source_kept
        purpose: 'Copy failure: failed, source untouched, no target'
        input:
          objects:
            bkt/incoming/s/a.txt: hello
          transfers:
            - path: s/a.txt
              source_bucket: bkt
              source_key: incoming/s/a.txt
              size: 5
              etag:
              target_bucket: bkt
              target_key: s/a.txt
          fail_calls:
            - operation: CopyObject
              key:
        params: {}
        expected:
          objects:
            - bkt/incoming/s/a.txt
          statuses:
            s/a.txt: failed
        expect_error: false
      - name: tagging_fails_still_moved
        purpose: Tagging failure is only a warning
        input:
          objects:
            bkt/incoming/s/a.txt: hello
          transfers:
            - path: s/a.txt
              source_bucket: bkt
              source_key: incoming/s/a.txt
              size: 5
              etag:
              target_bucket: bkt
              target_key: s/a.txt
          fail_calls:
            - operation: PutObjectTagging
              key:
        params: {}
        expected:
          objects:
            - bkt/s/a.txt
          statuses:
            s/a.txt: moved
        expect_error: false
      - name: existing_target_overwritten_tags_replaced
        purpose: Existing target overwritten; tags replaced by exactly one
        input:
          objects:
            bkt/incoming/s/a.txt: hello
            bkt/s/a.txt:
              body: old content
              tags:
                Old: '1'
                Other: '2'
          transfers:
            - path: s/a.txt
              source_bucket: bkt
              source_key: incoming/s/a.txt
              size: 5
              etag:
              target_bucket: bkt
              target_key: s/a.txt
        params: {}
        expected:
          objects:
            - bkt/s/a.txt
          tags:
            bkt/s/a.txt:
              ADDITIONAL_TAG: s/a.txt
          statuses:
            s/a.txt: moved
        expect_error: false
      - name: delete_fails_independent_files
        purpose: Delete failure fails that file only; others still move
        input:
          objects:
            bkt/incoming/s/a.txt: hello
            bkt/incoming/s/b.txt: world!
          transfers:
            - path: s/a.txt
              source_bucket: bkt
              source_key: incoming/s/a.txt
              size: 5
              etag:
              target_bucket: bkt
              target_key: s/a.txt
            - path: s/b.txt
              source_bucket: bkt
              source_key: incoming/s/b.txt
              size: 6
              etag:
              target_bucket: bkt
              target_key: s/b.txt
          fail_calls:
            - operation: DeleteObject
              key: incoming/s/b.txt
        params: {}
        expected:
          objects:
            - bkt/s/a.txt
            - bkt/incoming/s/b.txt
            - bkt/s/b.txt
          tags:
            bkt/s/a.txt:
              ADDITIONAL_TAG: s/a.txt
          statuses:
            s/a.txt: moved
            s/b.txt: failed
        expect_error: false
