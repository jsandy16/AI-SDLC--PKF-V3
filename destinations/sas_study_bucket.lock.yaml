# destinations/sas_study_bucket.lock.yaml — plan, step tests, simulation and code tests.
# Written by `pkf plan/code/test` and `pkf create`. Do not edit by hand.
lock_version: 2
kind: destination
name: sas_study_bucket
requirement_sha256: e2df5d5c31597f5c650d1e07e995b827bb2e54a55c3f370d09a1412b60e31a8f
plan:
  summary: 'Gives each file a target key in the same bucket, worked out from its folder path. Seven rules are checked (CDAP,
    IDAP, MED, ANON, CDAR, OTHERS, DEFAULT) and exactly one must match. Otherwise the file goes to error/{path}, so no file
    is ever dropped. A final custom_delivery step then moves each file: a server-side managed copy (multipart for large files),
    a check that the target exists with the right size, deletion of the source from incoming/, and on study targets a single
    ADDITIONAL_TAG tag that replaces all others. It reports one line per file.'
  why: The routing rules depend on parts of the path (study, last folder, the folder after 'ar', '_' parts), require 
    exactly one rule to match, and send everything else to an error/ prefix. route's first-match-wins globs cannot 
    express that, so one custom step computes every key with small pure helpers. Moving, deleting the source, replacing 
    tags and treating a tagging failure as a warning are not part of the framework's upload, so the plan ends with one 
    custom_delivery step. It receives the target keys from the first step and calls the same pure routing helper again 
    (decide_route) to get the rule name or error reason for its report line, so nothing extra has to be carried in the 
    layout.
  steps:
    - id: route_by_folder_rules
      op: custom
      title: Work out each file's target key from its folder path with the seven study rules; anything unclear goes to 
        error/
      params:
        function: route_by_folder_rules
      pseudocode: "1. For each path in layout['files'] whose layout['keys'].get(path) is None or missing:\n2.   key, label
        = decide_route(path)\n3.   layout['keys'][path] = key   (never None: a file is never dropped)\n4.   log one line:
        path, key, label\n5. Return layout. Never raises for a routing problem: a missing rule, several rules or an unworkable
        target all give error/{path}."
      unit:
        requires: layout['files'] = [path relative to incoming/] (one file per package); layout['keys'] empty
        guarantees: "layout['keys'][path] is set for every file: a study key, the same path (DEFAULT), or 'error/' + path.
          No key is None."
        clauses:
          - R-DST-1
          - R-DST-2
          - R-DST-3
          - R-DST-4
          - R-DST-5
          - R-DST-6
          - R-DST-7
          - R-DST-8
          - R-DST-9
          - R-DST-10
          - R-DST-11
          - R-DST-12
          - R-DST-13
          - R-DST-14
          - R-DST-15
          - R-DST-16
          - R-DST-17
          - R-DST-18
          - R-DST-19
          - R-DST-20
          - R-DST-21
          - R-DST-22
          - R-DST-23
          - R-DST-24
          - R-DST-25
          - R-DST-26
          - R-DST-27
          - R-DST-28
          - R-DST-29
        reason: route takes the first matching rule, but here every rule must be checked and exactly one must match. 
          Keys are built from path segments (study, last folder, the folder after 'ar', '_' parts of a folder), and a 
          failure must go to an error/ prefix instead of failing. No catalogue operation can do that.
        edge_cases:
          - NAM-BAD-CHARS
          - NAM-KEY-LENGTH
          - "REQ-1: file at the root of incoming/ (no folder) → wrapped folder '/' → only DEFAULT matches → key = path"
          - 'REQ-2: CDAR and OTHERS both match (data_reuse + cdar) → error/{path}'
          - "REQ-3: CDAP interim whose last folder has fewer than 3 '_' parts → error/{path}"
          - "REQ-4: CDAP other whose last folder has fewer than 2 '_' parts → error/{path}"
          - "REQ-5: CDAR with no 'ar' folder, 'ar' as the last folder, or a level of adam/sdtm/raw (any case) → error/{path}"
          - "REQ-6: ANON last part 'IA500' (uppercase) → other, not interim"
          - 'REQ-7: restricted_raw/ → raw; _restricted_raw_ → raw'
          - 'REQ-8: the study folder is used exactly as written (case kept)'
          - 'REQ-9: a path with no data format under /data_reuse/ matches nothing → error/{path}'
        functions:
          - name: split_path
            signature: 'def split_path(path: str) -> tuple[list[str], str, str]'
            purpose: Splits a package path into its folders, its file name and the wrapped folder path used by the 
              contains checks.
            pseudocode: "1. parts = path.split('/'); file = parts[-1]; folders = [p for p in parts[:-1] if p != '']\n2. wrapped
              = '/' + '/'.join(folders) + '/' if folders else '/'\n3. Return (folders, file, wrapped)."
          - name: data_format
            signature: 'def data_format(wrapped: str) -> str | None'
            purpose: 'Data format from the folder path: adam, sdtm or raw by priority, else None.'
            pseudocode: "1. If '/adam/' in wrapped → 'adam'.\n2. Elif '/sdtm/' in wrapped → 'sdtm'.\n3. Elif 'raw/' in wrapped
              → 'raw' (this also covers restricted_raw/).\n4. Else None."
          - name: underscore_format
            signature: 'def underscore_format(wrapped: str) -> str | None'
            purpose: Data format for anonymised folders, taken from the underscore markers.
            pseudocode: "1. If '_adam_' in wrapped → 'adam'.\n2. Elif '_sdtm_' in wrapped → 'sdtm'.\n3. Elif '_raw_' in wrapped
              or '_restricted_raw_' in wrapped → 'raw'.\n4. Else None."
          - name: matching_rules
            signature: 'def matching_rules(wrapped: str) -> list[str]'
            purpose: Checks every rule and returns the names of all rules that match.
            pseudocode: "1. fmt = data_format(wrapped); ufmt = underscore_format(wrapped); dr = '/data_reuse/' in wrapped\n\
              2. CDAP if dr and '/cdap_' in wrapped and fmt\n3. IDAP if dr and '/idap' in wrapped and fmt\n4. MED if dr and
              '/med' in wrapped and fmt\n5. ANON if '_anon_' in wrapped and ufmt\n6. CDAR if '/cdar/' in wrapped and fmt\n\
              7. OTHERS if dr and fmt and none of '/med','/cdap','/idap','/anon','_anon_' in wrapped\n8. DEFAULT if none of
              '/data_reuse/','_anon_','/cdar/' in wrapped\n9. Return the names in this order."
          - name: ia_label
            signature: 'def ia_label(part: str) -> str'
            purpose: Writes an interim part as ia_ + the rest.
            pseudocode: "1. rest = part[2:] if part.lower().startswith('ia') else part\n2. rest = rest.lstrip('_')\n3. If
              rest == '' → raise ValueError('empty interim label').\n4. Return 'ia_' + rest."
          - name: target_cdap
            signature: 'def target_cdap(folders: list[str], file: str, wrapped: str, fmt: str) -> str'
            purpose: 'CDAP key: primary, interim or other.'
            pseudocode: "1. study = folders[0]; last = folders[-1]\n2. If '/cdap_csr' in wrapped → f'{study}/extended_primary_use/primary/{fmt}/{file}'.\n\
              3. parts = last.split('_')\n4. If '_ia' in last: if len(parts) < 3 → raise ValueError('CDAP interim: fewer than
              3 parts in last folder'); return f'{study}/extended_primary_use/interim/{fmt}/{ia_label(parts[2])}/{file}'.\n\
              5. If len(parts) < 2 → raise ValueError('CDAP other: fewer than 2 parts in last folder').\n6. Return f'{study}/extended_primary_use/other/{fmt}/{parts[1]}/{file}'."
          - name: target_anon
            signature: 'def target_anon(folders: list[str], file: str, wrapped: str, ufmt: str) -> str'
            purpose: 'ANON key: primary, interim or other.'
            pseudocode: "1. study = folders[0]; last = folders[-1]\n2. If '_anon_csr' in wrapped → f'{study}/anonymised/primary/{ufmt}/{file}'.\n\
              3. part = last.split('_')[-1]\n4. If part.startswith('ia') (case-sensitive) → f'{study}/anonymised/interim/{ufmt}/{ia_label(part)}/{file}'.\n\
              5. If part == '' → raise ValueError('ANON: empty last part').\n6. Else → f'{study}/anonymised/other/{ufmt}/{part}/{file}'."
          - name: target_cdar
            signature: 'def target_cdar(folders: list[str], file: str, fmt: str) -> str'
            purpose: CDAR key from the reporting level after the 'ar' folder.
            pseudocode: "1. i = index of the first folder f with f.lower() == 'ar'; if none or i is the last folder → raise
              ValueError('CDAR: no reporting level after ar').\n2. level = folders[i+1]; low = level.lower()\n3. If low in
              ('adam','sdtm','raw') → raise ValueError(f'CDAR: reporting level is {low}').\n4. study = folders[0]\n5. If low
              == 'csr' → f'{study}/primary/complete/{fmt}/{file}'.\n6. If low.startswith('ia') → f'{study}/primary/interim/{fmt}/{ia_label(level)}/{file}'.\n\
              7. Else → f'{study}/primary/other/{fmt}/{level}/{file}'."
          - name: decide_route
            signature: 'def decide_route(path: str) -> tuple[str, str]'
            purpose: Final key and the rule name or error reason for one file.
            pseudocode: "1. folders, file, wrapped = split_path(path); err = 'error/' + path\n2. rules = matching_rules(wrapped)\n\
              3. If len(rules) == 0 → (err, 'error: no rule matches').\n4. If len(rules) > 1 → (err, 'error: several rules
              match: ' + ','.join(rules)).\n5. rule = rules[0]; fmt = data_format(wrapped); ufmt = underscore_format(wrapped)\n\
              6. Try: CDAP → target_cdap(folders, file, wrapped, fmt); IDAP → f'{folders[0]}/internal_reuse/{fmt}/{folders[-1]}/{file}';
              MED → f'{folders[0]}/external_reuse/{fmt}/{folders[-1]}/{file}'; ANON → target_anon(folders, file, wrapped,
              ufmt); CDAR → target_cdar(folders, file, fmt); OTHERS → f'{folders[0]}/other/{fmt}/{folders[-1]}/{file}'; DEFAULT
              → path.\n7. On ValueError e → (err, f'error: {rule}: {e}').\n8. If len(key.encode('utf-8')) > 1024 → (err, 'error:
              key longer than 1024 bytes').\n9. Return (key, rule)."
    - id: move_and_tag
      op: custom_delivery
      title: Move each file (copy, check, delete source), tag study targets and report one line per file
      params:
        function: move_and_tag
      pseudocode: "1. results = []. For each t in transfers (one failing file does not stop the others):\n2.   label = decide_route(t['path'])[1];
        to_error = is_error_target(t['target_key'])\n3.   extra = {'CopySourceIfMatch': t['etag']} if t['etag'] else {}; add
        ServerSideEncryption / SSEKMSKeyId from ctx['delivery'] when set (overwrite: no existence check).\n4.   Try aws.s3_destination.copy({'Bucket':
        t['source_bucket'], 'Key': t['source_key']}, t['target_bucket'], t['target_key'], ExtraArgs=extra, SourceClient=aws.s3_source)
        (managed copy, multipart for large files). On error → result failed 'copy failed: <err>'; source left in place; log;
        continue.\n5.   Try head = aws.s3_destination.head_object(Bucket=t['target_bucket'], Key=t['target_key']); if head['ContentLength']
        != t['size'] → failed 'check failed: size mismatch'; on error → failed 'check failed: <err>'; source left in place;
        continue.\n6.   Try d = aws.s3_source.delete_object(Bucket=t['source_bucket'], Key=t['source_key']); on error → failed
        'delete failed: <err> (target copied)'; continue. note = ' (delete marker)' if d.get('DeleteMarker') else ''.\n7.\
        \   If not to_error: value = t['path']; if tag_value_ok(value): try aws.s3_destination.put_object_tagging(Bucket=t['target_bucket'],
        Key=t['target_key'], Tagging={'TagSet':[{'Key':'ADDITIONAL_TAG','Value':value}]}) except error → aws.log.warning(...)
        and record 'tag warning' in detail; else aws.log.warning('tag value not allowed') and record it in detail.\n8.   status
        = 'moved_to_error' if to_error else 'moved'; detail = label + note + any tag warning.\n9.   aws.log.info(report_line(t['source_key'],
        t['target_key'], detail)); append {'path': t['path'], 'key': t['target_key'], 'status': status, 'detail': detail}.\n\
        10. Return results (exactly one per transfer)."
      unit:
        requires: "layout['keys'] set for every file by route_by_folder_rules; S3 source and destination are the same bucket;
          no transformation; ctx['delivery'] = {if_exists: overwrite, server_side_encryption: null, kms_key_id: null}"
        guarantees: Each moved file is at its target key and its incoming/ source is deleted. Study targets carry 
          exactly one tag, ADDITIONAL_TAG = the path. error/ targets keep their tags. A failed copy or check leaves the 
          source in place with status 'failed'. A failed delete gives status 'failed'. There is one result per transfer.
        clauses:
          - R-RUN-1
          - R-RUN-2
          - R-RUN-3
          - R-RUN-4
          - R-RUN-5
          - R-RUN-6
          - R-RUN-7
          - R-RUN-8
          - R-RUN-9
          - R-RUN-10
          - R-RUN-11
          - R-RUN-12
          - R-DST-28
        reason: Moves (deleting the source after a confirmed copy), replacing object tags with a tagging failure counted
          only as a warning, and per-file move statuses where error/ moves do not fail the run are not part of the 
          framework's upload.
        edge_cases:
          - DEL-OVERWRITE
          - DEL-LARGE-COPY
          - DEL-PARTIAL
          - DEL-IDEMPOTENT
          - DEL-SSE
          - DEL-VERSIONED
          - DEL-TAGS
          - DEL-VERIFY
          - 'REQ-10: the ETag changed since listing (CopySourceIfMatch fails) → failed, source kept'
          - 'REQ-11: tag value longer than 256 characters or with characters S3 does not allow → warning, the file still counts
            as moved'
          - 'REQ-12: delete fails after a good copy → failed (the run fails); the target stays'
        functions:
          - name: is_error_target
            signature: 'def is_error_target(key: str) -> bool'
            purpose: Whether a target key is under the error/ prefix.
            pseudocode: 1. Return key.startswith('error/').
          - name: tag_value_ok
            signature: 'def tag_value_ok(value: str) -> bool'
            purpose: Whether a string is a valid S3 tag value.
            pseudocode: 1. Return len(value) <= 256 and every character is a Unicode letter, digit, whitespace or one of
              '+-=._:/@'.
          - name: report_line
            signature: 'def report_line(source_key: str, target_key: str, detail: str) -> str'
            purpose: Builds the one-line report for a file.
            pseudocode: 1. Return f'source={source_key} target={target_key} reason={detail}'.
  assumptions:
    - All contains checks run on the folder path relative to incoming/ (without the file name), wrapped in a leading and
      a trailing '/'. The file name is never checked.
    - Study = the first folder of the package path. Package paths are already relative to incoming/; the source key is 
      incoming/ + path.
    - "CDAP interim: the third '_' part is written as 'ia_' + the part with a leading 'ia' (any case) and any leading '_'
      removed. If the part does not start with 'ia', the whole part goes after 'ia_'. An empty rest gives an error."
    - "CDAR: the first folder named 'ar' (case-insensitive) is used. The reporting level is written in the key as it appears
      in the path; the lowercase form is used only for the comparisons."
    - ANON 'last part' = the text after the last '_' in the last folder. ANON with _anon_csr is checked against the 
      whole wrapped folder path.
    - OTHERS matches only on /data_reuse/, a data format and the absence of /med, /cdap, /idap, /anon and _anon_. The 
      CDAR marker /cdar/ does not exclude it, so data_reuse+cdar paths match two rules and go to error/, as the worked 
      example shows.
    - A delete that fails after a good copy gives status 'failed' (the run fails, as the requirement says). The copied 
      target is left in place.
    - When the tag value (the path) is not a valid S3 tag value (more than 256 characters or characters S3 does not 
      allow), tagging is skipped with a warning and the file still counts as moved. The value is not truncated.
    - The delivery step calls decide_route again to get the rule or error reason for its report line. The function is 
      pure, so it gives the same result as in the routing step.
    - 'Delivery policies stay as configured: overwrite, no SSE, no success marker.'
