kind: source
name: sas_incoming
requirement_sha256: 273bbe43c960090c371077821477335fdb75da6b0199c446a5cabcc3a3c5919b
plan:
  summary: Lists all objects under incoming/ in the S3 bucket, keeps only files that sit inside a study folder and have 
    a '.' extension in the file name, and makes each remaining file its own package. Folder markers, files directly 
    under incoming/ and extensionless files are skipped without error.
  steps:
    - id: list_incoming
      op: list
      title: List everything under incoming/
      params:
        root: incoming/
    - id: keep_study_files
      op: select
      title: Keep files in a study folder whose name has an extension
      params:
        regex: ^[^/]+/(?:[^/]+/)*[^/]+\.[^/]+$
    - id: one_package_per_file
      op: split
      title: One package per file
      params:
        by: regex
        regex: ^(?P<key>.+)$
  assumptions:
    - Bucket and region (eu-north-1) come from the component settings, not from a step.
    - Paths are relative to incoming/, so the first path segment is the study ID, kept exactly as written.
    - "The select regex is applied to the path relative to incoming/ and requires: study folder, then optional subfolders,
      then a file name containing a '.' with characters after it."
    - Splitting by a regex whose key is the whole path gives exactly one package per file, with the path inside the 
      package unchanged.
    - Dot-leading names like '.hidden' count as having an extension (the name contains '.' with text after it).
    - Folder markers (keys ending in '/') never match the regex, so they are skipped.
  ambiguities: []
  step_tests: {}
