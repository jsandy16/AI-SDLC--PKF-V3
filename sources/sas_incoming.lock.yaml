plan:
  summary: sas_incoming lists every object under incoming/ in the environment's SAS S3 bucket (eu-north-1), at any 
    depth, with paths relative to incoming/. It silently drops folder markers, files that sit directly under incoming/, 
    and files with no '.' extension. Every remaining file becomes its own package, keyed by its relative path in the 
    variable file_key. Each package carries the S3 reference (root incoming/ + path) that the destination's custom 
    delivery uses for the server-side move and the tag.
  why: "Catalogue steps cover the whole source: list finds the objects, select drops the skipped ones, and split makes one
    package per file. No custom step is needed. The R-RUN clauses (move, check, delete, tag, report, run outcome) are carried
    out by the destination's single custom_delivery step, because a source catalogue has no delivery operation. They are cited
    here on the source steps that make them possible: list keeps the S3 reference and size each move needs, and split makes
    each file an independent package. That package is the unit that succeeds or fails on its own, gets its own report line,
    and carries file_key as the ADDITIONAL_TAG value."
  steps:
    - id: list_incoming
      op: list
      title: List every object under incoming/ at any depth
      params:
        root: incoming/
      unit:
        requires: The S3 source connection (the environment's SAS bucket in eu-north-1, the same bucket as the 
          destination) is set in settings, not in the plan.
        guarantees: One group holds every object under incoming/, with all pages listed. Each file has root 'incoming/',
          path relative to incoming/, size and mtime. root+path is the exact source key. The destination's delivery uses
          it for the server-side managed copy (including objects over 5 GiB), for the delete after the existence check, 
          and for leaving the source in place when the copy or check fails. Nothing is staged or opened, because S3→S3 
          direct delivery passes references.
        clauses:
          - R-SRC-1
          - R-SRC-2
          - R-SRC-3
          - R-SRC-4
          - R-RUN-1
          - R-RUN-2
          - R-RUN-3
          - R-RUN-4
          - R-RUN-5
          - R-RUN-12
    - id: skip_unwanted
      op: select
      title: Silently skip folder markers, top-level files and files without an extension
      params:
        regex: ^[^/]+/(?:[^/]+/)*[^/]*\.[^/]*$
      unit:
        requires: 'list_incoming has run: file paths are relative to incoming/.'
        guarantees: The only files left are inside at least one study folder and have a '.' in their name. Keys ending 
          in '/', files directly under incoming/ and names with no extension are dropped. They are never packaged, 
          moved, tagged or reported. Zero-byte files that pass these rules are kept.
        clauses:
          - R-SRC-5
          - R-SRC-6
          - R-SRC-7
          - R-SRC-8
          - R-RUN-8
    - id: one_package_per_file
      op: split
      title: Make each remaining file its own package
      params:
        by: regex
        regex: ^(?P<key>.+)$
        var: file_key
      unit:
        requires: 'skip_unwanted has run: only eligible files are left.'
        guarantees: "There is one group per file, with vars.file_key set to the file's path relative to incoming/. That is
          the original path without incoming/, which delivery writes as the single ADDITIONAL_TAG. The study ID is file_key's
          first segment, kept exactly as written. Each file succeeds or fails on its own: a failed copy, check or delete fails
          only that package, and that makes the run fail. Moves to error/ and tagging warnings do not fail it. The report
          has one record per file. If nothing is left, there are zero packages and the run succeeds."
        clauses:
          - R-SRC-9
          - R-SRC-10
          - R-RUN-6
          - R-RUN-7
          - R-RUN-9
          - R-RUN-10
          - R-RUN-11
  assumptions:
    - The R-RUN clauses (server-side copy above 5 GiB, existence check, delete, overwrite, tag replacement, warning-only
      tagging, no tags in error/, report lines, run outcome) are carried out by the destination's custom_delivery step. 
      The source steps cite them because they provide the per-file S3 reference, size and file_key that delivery needs, 
      and the one-file-per-package isolation.
    - A name 'has an extension' when its last path segment contains a '.' anywhere. Dotfiles like '.keep' and names 
      ending in '.' therefore count as having one.
    - Zero-byte files inside a study folder that have an extension are kept, like any other file.
    - The bucket name comes from the per-environment S3 connection settings and is never written in the plan.
  ambiguities: []
  step_tests: {}
  function_tests: {}
