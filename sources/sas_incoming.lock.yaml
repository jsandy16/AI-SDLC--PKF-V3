plan:
  summary: Lists every object under incoming/ in the environment's SAS S3 bucket (eu-north-1). The bucket is also the 
    destination. It silently drops folder markers, files that sit directly under incoming/ with no study folder, and 
    files with no extension. Every remaining file becomes its own package. Paths stay relative to incoming/, so the 
    first path segment is the study ID exactly as written.
  why: Three catalogue steps do the whole job, so no custom code is needed. list finds all objects under incoming/, 
    select keeps only usable files, and split makes one package per file. Because each file is its own package, retries,
    report lines and failure isolation all work per file in the runtime. The run-level clauses (R-RUN-1/2/3) and the 
    same-bucket clause (R-SRC-2) are cited on the steps that make them possible. Their actual settings belong to the 
    pipeline's run settings, the source/destination connections and the destination's delivery step.
  steps:
    - id: list_incoming
      op: list
      title: List every object under incoming/ at any depth in the SAS bucket
      params:
        root: incoming/
      unit:
        requires: S3 source connection to the environment's SAS bucket in eu-north-1 (bucket from the env settings). The
          destination uses the same bucket. The run's retry policy (2 retries, 2 minutes apart) is set in the pipeline 
          run settings.
        guarantees: One group holding every object under incoming/ (all pages). Each file's path is relative to 
          incoming/, e.g. 'S-001/a/x.sas7bdat'. Source and destination refer to the same bucket, so delivery can copy 
          and move within it. A failed planning run is retried under the run's retry policy.
        clauses:
          - R-SRC-1
          - R-SRC-2
          - R-SRC-3
          - R-RUN-1
    - id: skip_unusable
      op: select
      title: Silently skip folder markers, files with no study folder, and files with no extension
      params:
        include:
          - '*/**/*.*'
      unit:
        requires: The group from list_incoming, with paths relative to incoming/
        guarantees: Only files that sit at least one folder below incoming/ and whose name contains a '.' remain. 
          Markers ('S-001/'), root files ('readme.txt') and names like 'no_extension' are dropped without being reported
          or moved.
        clauses:
          - R-SRC-4
          - R-SRC-5
          - R-SRC-6
          - R-SRC-8
    - id: one_package_per_file
      op: split
      title: Make each remaining file its own package
      params:
        by: regex
        regex: ^(.+)$
        var: file
      unit:
        requires: The filtered group from skip_unusable
        guarantees: "One group per file. vars['file'] holds the file's path relative to incoming/, and its first segment is
          the study ID, unchanged. Packages are independent: one file's failure never stops another, each file gets its own
          report line, and the run fails only through failed packages (copy, check or delete). Moves to error/ that the destination
          counts as handled do not fail it."
        clauses:
          - R-SRC-7
          - R-SRC-8
          - R-RUN-2
          - R-RUN-3
  assumptions:
    - R-RUN-1 (2 retries, 2 minutes apart) is a pipeline run setting. The source makes no decision for it and only cites
      it.
    - R-SRC-2 (same bucket) is met by pointing the source and destination connections at the same env-configured bucket.
      The source only lists under incoming/, so it never sees files in other prefixes such as error/.
    - R-RUN-2 and R-RUN-3 are met by one package per file plus the destination's delivery and report. The source only 
      enables them by splitting per file.
    - "'**' in the include glob matches zero or more folders, so 'S-001/x.sas7bdat' (a file directly in the study folder)
      is kept."
    - A name counts as having an extension when its last path segment contains a '.'. Hidden names like '.hidden' are 
      kept.
    - Zero-byte files that have an extension and a study folder are kept as packages. Only markers are dropped. An empty
      bucket gives zero packages and the run succeeds.
  ambiguities: []
  step_tests: {}
  function_tests: {}
