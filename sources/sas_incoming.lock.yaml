lock_version: 2
kind: source
name: sas_incoming
requirement_sha256: 065f305546921b6eb019361bd03021874a0f4103caf8927f1f0e1d18c7eca4f4
plan:
  summary: Lists every object under incoming/ in the SAS bucket. It keeps only files that sit inside a study folder and 
    whose name has a "." extension, which also drops folder markers. It then makes one package per file and sets 
    package_key to the path relative to incoming/.
  steps:
    - id: list_incoming
      op: list
      title: List all objects under incoming/
      params:
        root: incoming/
    - id: keep_study_files_with_extension
      op: select
      title: Skip folder markers, files outside a study folder, and files with no extension
      params:
        regex: ^[^/]+/(?:[^/]+/)*[^/]+\.[^/]*$
    - id: split_per_file
      op: split
      title: One package per file, key = relative path
      params:
        by: regex
        regex: ^(.+)$
        var: package_key
  assumptions:
    - The bucket and region (eu-north-1) come from the component settings, not from a step.
    - Folder markers are listed with paths ending in '/', so the regex, which needs a file name after the last '/', 
      drops them.
    - A file has an extension when its name (the part after the last '/') contains a '.'. Names that start or end with 
      '.' count as having one.
    - The study ID is the first folder of the relative path. It is kept as written and needs no step.
    - The regex split is matched against the path relative to incoming/, so package_key equals that path.
    - The regex is matched against the whole relative path.
  ambiguities: []
  step_tests: {}
