# source `sas_incoming`: written from the split of pipeline `sas_folder_restructure_wf`. Fill in every <REQUIRED>.
api_version: pkf/v1
kind: source
name: sas_incoming
description: from the source part of the pipeline requirement
type: s3
connection:
  bucket: dev-dpl-dstore-sas-eu-north-1-992382551516
  region: eu-north-1
credentials:
  provider: none
params: {}
requirement: "The source is the environment's SAS S3 bucket in region eu-north-1. The bucket name is set per environment (development:
  dev-dpl-dstore-sas-eu-north-1-992382551516). List every object under the prefix incoming/ at any depth, recursively. Paths
  are taken relative to incoming/. Skip silently (do not move, do not report): folder markers (keys ending in \"/\"); files
  directly under incoming/ with no study folder (e.g. incoming/readme.txt); files whose name has no \".\" extension. Each
  remaining file is its own package (one package per file, split by the file's relative path, which sets the variable file_key),
  so a problem with one file does not stop the others. The study ID is the first folder after incoming/, used exactly as written
  (case and hyphens kept). Files are not opened.\n"
examples:
  - name: normal_files
    event:
    listing:
      - incoming/S1/root/cdar/d000/S1/ar/csr/adam/dev/data/a.sas7bdat:10
      - incoming/04-3077/x/b.sas7bdat:20
    contents: {}
    params: {}
    expected_packages:
      -   - S1/root/cdar/d000/S1/ar/csr/adam/dev/data/a.sas7bdat
      -   - 04-3077/x/b.sas7bdat
    expect_error: false
  - name: skips
    event:
    listing:
      - incoming/S1/folder/:0
      - incoming/readme.txt:10
      - incoming/S1/data/no_extension:5
      - incoming/S1/data/ok.pdf:7
    contents: {}
    params: {}
    expected_packages:
      -   - S1/data/ok.pdf
    expect_error: false
  - name: nothing_to_do
    event:
    listing:
      - incoming/:0
      - incoming/readme.txt:10
    contents: {}
    params: {}
    expected_packages: []
    expect_error: false
