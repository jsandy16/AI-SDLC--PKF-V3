# source `sas_incoming`: written from the approved split of pipeline `sas_folder_restructure_wf` (@jsandy16). Fill in every <REQUIRED>.
api_version: pkf/v1
kind: source
name: sas_incoming
description: from the source part of the pipeline requirement
type: s3
connection:
  bucket: dev-dpl-dstore-sas-eu-north-1-992382551516
  region: eu-north-1
credentials:
  provider: none
params: {}
requirement: "Read from the SAS S3 bucket (region eu-north-1). List every object under the prefix incoming/ at any depth;
  paths in packages are relative to incoming/. Silently skip (no package, no report): folder markers (keys ending in \"/\"\
  ), files directly under incoming/ with no study folder (e.g. incoming/readme.txt), and files whose name has no \".\" extension.
  Each remaining file is its own package (split per file, setting a variable package_key to the relative path), so a problem
  with one file does not stop the others. The study ID is the first folder after incoming/, used exactly as written (case
  and hyphens kept).\n"
examples:
  - name: normal_files_one_package_each
    event:
    listing:
      - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat:10
      - incoming/04-3077/root/data_reuse/d525/04-3077/med/adam/prod/data/adae.sas7bdat:10
    contents: {}
    params: {}
    expected_packages:
      -   - d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat
      -   - 04-3077/root/data_reuse/d525/04-3077/med/adam/prod/data/adae.sas7bdat
    expect_error: false
  - name: skips_marker_no_study_folder_no_extension
    event:
    listing:
      - incoming/:0
      - incoming/D1/:0
      - incoming/readme.txt:10
      - incoming/04-3077/root/data_reuse/d525/04-3077/shared/adam/prod/data/no_extension:10
      - incoming/ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf:10
    contents: {}
    params: {}
    expected_packages:
      -   - ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf
    expect_error: false
  - name: empty_incoming
    event:
    listing: []
    contents: {}
    params: {}
    expected_packages: []
    expect_error: false
