# pipelines/sas_folder_restructure.lock.yaml — the AI's split of the pipeline requirement and its approval.
# Written by `pkf plan pipeline` / `pkf approve-plan pipeline`. Do not edit by hand.
lock_version: 1
pipeline: sas_folder_restructure
requirement_sha256: 7619d3a76f307c65f56ec61fbd63ec2ac7ad38faff36ed54676337a389933495
split:
  summary: A schedule trigger starts a run every 45 minutes, with 2 retries 2 minutes apart. The source lists every 
    object under incoming/ in the SAS bucket. It skips folder markers, files directly under incoming/, and files with no
    extension. Each remaining file becomes its own package. No transformation is applied. The destination, in the same 
    bucket, works out the target key from the folder path using the seven rules. It sends files that match no rule, or 
    more than one rule, to error/. Each file is moved with a server-side copy, an existence check, and a delete of the 
    source. After a successful move it sets a single ADDITIONAL_TAG on the target, and it reports one line per file.
  components:
    trigger:
      name: every_45_minutes
      reuse: false
      spec:
        api_version: pkf/v1
        kind: trigger
        name: every_45_minutes
        description: from the trigger part of the pipeline requirement
        schedule: '*/45 * * * *'
        connection:
          region: eu-north-1
        params:
          retries: '2'
          retry_delay_seconds: '120'
    source:
      name: sas_incoming
      reuse: false
      spec:
        api_version: pkf/v1
        kind: source
        name: sas_incoming
        description: from the source part of the pipeline requirement
        type: s3
        connection:
          bucket: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        params: {}
        requirement: "Read from the S3 bucket (region eu-north-1). List every object under the prefix incoming/ at any depth;
          paths are relative to incoming/. Skip silently: folder markers (keys ending in '/'); files directly under incoming/
          with no study folder (e.g. incoming/readme.txt); files whose name has no '.' extension. Each remaining file is its
          own package (one package per file), so a problem with one file does not stop the others. The study ID is the first
          folder after incoming/, used exactly as written.\n"
        examples:
          - name: normal_files_one_package_each
            event:
            listing:
              - incoming/d0000c00004/root/cdar/ar/csr/adam/a.sas7bdat:10
              - incoming/ABCD-0000-0000/x.pdf:10
            contents: {}
            params: {}
            expected_packages:
              -   - d0000c00004/root/cdar/ar/csr/adam/a.sas7bdat
              -   - ABCD-0000-0000/x.pdf
            expect_error: false
          - name: skips
            event:
            listing:
              - incoming/:0
              - incoming/S1/:0
              - incoming/readme.txt:10
              - incoming/S1/data/no_extension:10
              - incoming/S1/data/a.csv:10
            contents: {}
            params: {}
            expected_packages:
              -   - S1/data/a.csv
            expect_error: false
          - name: deep_nesting
            event:
            listing:
              - incoming/04-3077/a/b/c/d/e/f.sas7bdat:10
            contents: {}
            params: {}
            expected_packages:
              -   - 04-3077/a/b/c/d/e/f.sas7bdat
            expect_error: false
    destination:
      name: sas_restructured
      reuse: false
      spec:
        api_version: pkf/v1
        kind: destination
        name: sas_restructured
        description: from the destination part of the pipeline requirement
        type: s3
        connection:
          bucket: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        delivery:
          if_exists: overwrite
          server_side_encryption:
          write_success_marker: false
        params: {}
        requirement: "Deliver into the same S3 bucket as the source (region eu-north-1). Each package is one file whose package
          path is the path relative to incoming/ (first folder = study ID, used exactly as written). The target is decided
          from the folder path only (path without the file name); the file name is always kept. Data format from the folder
          path: adam if it contains /adam/, otherwise sdtm if it contains /sdtm/, otherwise raw if it contains raw/ (so restricted_raw/
          also counts as raw). For anonymised folders the data format comes from _adam_, _sdtm_, _raw_ or _restricted_raw_
          (= raw). 'Last folder' = the folder that directly contains the file. Every rule is checked; exactly one rule must
          match. 1. CDAP: path contains /data_reuse/ and /cdap_ and a data format. If it contains /cdap_csr -> {study}/extended_primary_use/primary/{format}/{file}.
          Else if the last folder contains _ia -> take the third '_' part of the last folder (cdap_20210617_ia300 -> ia300)
          and write it as ia_ + the rest (ia_300) -> {study}/extended_primary_use/interim/{format}/ia_300/{file}; fewer than
          3 parts -> error. Else -> second '_' part of the last folder (cdap_20210617 -> 20210617) -> {study}/extended_primary_use/other/{format}/20210617/{file};
          fewer than 2 parts -> error. 2. IDAP: path contains /data_reuse/ and /idap and a data format -> {study}/internal_reuse/{format}/{last
          folder}/{file}. 3. MED: path contains /data_reuse/ and /med and a data format -> {study}/external_reuse/{format}/{last
          folder}/{file}. 4. ANON: path contains _anon_ and an underscore data format (_adam_, _sdtm_, _raw_, _restricted_raw_).
          If it contains _anon_csr -> {study}/anonymised/primary/{format}/{file}. Else take the last '_' part of the last
          folder: starts with lowercase ia (case-sensitive, e.g. ia500) -> {study}/anonymised/interim/{format}/ia_500/{file};
          otherwise (e.g. 20220120) -> {study}/anonymised/other/{format}/20220120/{file}. 5. CDAR: path contains /cdar/ and
          a data format. Reporting level = the folder right after the folder named 'ar' (case-insensitive, compared in lowercase).
          No 'ar' folder, or reporting level is adam, sdtm or raw -> error. csr -> {study}/primary/complete/{format}/{file}.
          Starts with ia -> remove 'ia' and any leading '_', then add 'ia_' (ia1 -> ia_1, ia_psc -> ia_psc) -> {study}/primary/interim/{format}/{ia_x}/{file}.
          Anything else (bdr200) -> {study}/primary/other/{format}/bdr200/{file}. 6. OTHERS: path contains /data_reuse/ and
          a data format, and none of /med, /cdap, /idap, /anon, _anon_ -> {study}/other/{format}/{last folder}/{file}. 7.
          DEFAULT (pass-through): path has none of /data_reuse/, _anon_, /cdar/ -> the same path (incoming/ removed). If no
          rule matches, more than one rule matches, or the target cannot be worked out -> move the file to error/{path without
          incoming/}. Never drop a file. Examples: incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/ia100/sdtm/dev/data/data_area/b.sas7bdat
          -> d0000c00004/primary/interim/sdtm/ia_100/b.sas7bdat; incoming/ABCD-0000-0000/x.pdf -> ABCD-0000-0000/x.pdf. DELIVERY
          BEHAVIOUR: Move, not copy: copy server-side (files can be larger than 5 GiB), confirm the target exists, then delete
          the source from incoming/. If the copy or the check fails, leave the source in incoming/ so the next run retries
          it; that file fails. An existing object at the target is overwritten. After a successful move, replace all tags
          on the target with exactly one tag: ADDITIONAL_TAG = the original path without incoming/. A tagging failure is only
          a warning (the file still counts as moved). Files moved to error/ get no tag change. Report one line per file: source,
          target, rule or error reason. The run fails only if a copy, check or delete failed. Moving files to error/ does
          not fail the run.\n"
        examples:
          - name: cdar_csr
            files:
              - d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat
            vars:
              package: p1
            params: {}
            expected_keys:
              - d0000c00004/primary/complete/adam/a.sas7bdat
            expect_error: false
          - name: cdap_interim
            files:
              - d0000c00004/data_reuse/d000/d0000c00004/ar/shared/raw/dev/data/cdap_20210617_ia300/b.sas7bdat
            vars:
              package: p2
            params: {}
            expected_keys:
              - d0000c00004/extended_primary_use/interim/raw/ia_300/b.sas7bdat
            expect_error: false
          - name: anon_other
            files:
              - d0000c00004/d0000c00004_raw_anon_20220120/c.sas7bdat
            vars:
              package: p3
            params: {}
            expected_keys:
              - d0000c00004/anonymised/other/raw/20220120/c.sas7bdat
            expect_error: false
          - name: default_passthrough
            files:
              - ABCD-0000-0000/x.pdf
            vars:
              package: p4
            params: {}
            expected_keys:
              - ABCD-0000-0000/x.pdf
            expect_error: false
          - name: no_rule_to_error
            files:
              - 04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat
            vars:
              package: p5
            params: {}
            expected_keys:
              - error/04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat
            expect_error: false
  errors: []
  package_name: '{source}_{ds_nodash}'
  pipeline_examples:
    - name: cdar_routes
      messages: []
      conf:
      listing:
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat:10
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/ia100/sdtm/dev/data/data_area/b.sas7bdat:10
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/bdr200/raw/dev/data/data_area/c.sas7bdat:10
      params: {}
      expected_keys:
        - d0000c00004/primary/complete/adam/a.sas7bdat
        - d0000c00004/primary/interim/sdtm/ia_100/b.sas7bdat
        - d0000c00004/primary/other/raw/bdr200/c.sas7bdat
      expect_error: false
    - name: default_errors_and_skips
      messages: []
      conf:
      listing:
        - incoming/ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf:10
        - incoming/04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat:10
        - incoming/readme.txt:10
        - incoming/04-3077/root/data_reuse/d525/04-3077/shared/adam/prod/data/no_extension:10
      params: {}
      expected_keys:
        - ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf
        - error/04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat
      expect_error: false
  assumptions:
    - Retries (2) and the retry delay (2 minutes = 120 seconds) are in trigger params as strings.
    - The bucket name is per environment, so it is "<REQUIRED>".
    - Source and destination use the same bucket.
    - Each file is its own package, so the source splits the listing into one package per file.
    - 'The destination overwrites an existing object at the target (if_exists: overwrite).'
    - The package_name template is a placeholder because package names do not affect the target keys.
  ambiguities: []
  to_fill_in:
    - destination.connection.bucket
    - source.connection.bucket
owned:
  -   - connection
      - sas_folder_restructure_connection
  -   - destination
      - sas_restructured
  -   - source
      - sas_incoming
  -   - trigger
      - every_45_minutes
