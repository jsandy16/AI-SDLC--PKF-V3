lock_version: 1
pipeline: sas_folder_restructure_wf
requirement_sha256: aa31540f59693f56c77edf85d491fff955e9e54384f47c0ffcb3f27636e5bbbf
split:
  summary: A schedule trigger runs every 45 minutes (2 retries, 2 minutes apart) with no events. The source lists every 
    object under incoming/ in the SAS bucket (eu-north-1). It skips folder markers, files with no study folder, and 
    files with no extension. Each remaining file is its own package. There is no transformation, because files are never
    opened or changed. The destination applies the seven routing rules to the folder path and picks the target key. A 
    file with no match, several matches, or an unresolvable target goes to error/{path}. Delivery is a server-side copy 
    into the same bucket, then a check that the target exists, then deletion of the source. After a successful move the 
    target gets exactly one tag, ADDITIONAL_TAG. Only a failed copy, check or delete fails the run.
  components:
    trigger:
      name: sas_schedule_trigger
      reuse: false
      spec:
        api_version: pkf/v1
        kind: trigger
        name: sas_schedule_trigger
        description: from the trigger part of the pipeline requirement
        schedule: '*/45 * * * *'
        connection:
          region: eu-north-1
        params:
          retries: '2'
          retry_delay_seconds: '120'
    source:
      name: sas_incoming
      reuse: false
      spec:
        api_version: pkf/v1
        kind: source
        name: sas_incoming
        description: from the source part of the pipeline requirement
        type: s3
        connection:
          bucket: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        params: {}
        requirement: "Read from the SAS S3 bucket (region eu-north-1). List every object under the prefix incoming/ at any
          depth; paths in packages are relative to incoming/. Silently skip (no package, no report): folder markers (keys
          ending in \"/\"), files directly under incoming/ with no study folder (e.g. incoming/readme.txt), and files whose
          name has no \".\" extension. Each remaining file is its own package (split per file, setting a variable package_key
          to the relative path), so a problem with one file does not stop the others. The study ID is the first folder after
          incoming/, used exactly as written (case and hyphens kept).\n"
        examples:
          - name: normal_files_one_package_each
            event:
            listing:
              - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat:10
              - incoming/04-3077/root/data_reuse/d525/04-3077/med/adam/prod/data/adae.sas7bdat:10
            contents: {}
            params: {}
            expected_packages:
              -   - d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat
              -   - 04-3077/root/data_reuse/d525/04-3077/med/adam/prod/data/adae.sas7bdat
            expect_error: false
          - name: skips_marker_no_study_folder_no_extension
            event:
            listing:
              - incoming/:0
              - incoming/D1/:0
              - incoming/readme.txt:10
              - incoming/04-3077/root/data_reuse/d525/04-3077/shared/adam/prod/data/no_extension:10
              - incoming/ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf:10
            contents: {}
            params: {}
            expected_packages:
              -   - ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf
            expect_error: false
          - name: empty_incoming
            event:
            listing: []
            contents: {}
            params: {}
            expected_packages: []
            expect_error: false
    destination:
      name: sas_restructured
      reuse: false
      spec:
        api_version: pkf/v1
        kind: destination
        name: sas_restructured
        description: from the destination part of the pipeline requirement
        type: s3
        connection:
          bucket: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        delivery:
          if_exists: skip_identical
          server_side_encryption:
          write_success_marker: false
        params: {}
        requirement: "Destination is the same S3 bucket as the source (region eu-north-1). Each package is one file whose
          path is relative to incoming/ (first folder = study ID, used exactly as written). Decide the target key from the
          folder path only (the path without the file name); the file name is always kept. Data format from the folder path:
          adam if it contains /adam/, otherwise sdtm if it contains /sdtm/, otherwise raw if it contains raw/ (so restricted_raw/
          also counts as raw). For anonymised folders the data format comes from _adam_, _sdtm_, _raw_ or _restricted_raw_
          (= raw). \"Last folder\" = the folder that directly contains the file. Check every rule; exactly one rule must match.
          1. CDAP: path contains /data_reuse/ and /cdap_ and a data format. If it contains /cdap_csr -> {study}/extended_primary_use/primary/{format}/{file}.
          Else if the last folder contains _ia -> take the third \"_\" part of the last folder (cdap_20210617_ia300 -> ia300)
          and write it as ia_ + the rest (ia_300) -> {study}/extended_primary_use/interim/{format}/ia_300/{file}; fewer than
          3 parts -> error. Else -> second \"_\" part of the last folder (cdap_20210617 -> 20210617) -> {study}/extended_primary_use/other/{format}/20210617/{file};
          fewer than 2 parts -> error. 2. IDAP: path contains /data_reuse/ and /idap and a data format -> {study}/internal_reuse/{format}/{last
          folder}/{file}. 3. MED: path contains /data_reuse/ and /med and a data format -> {study}/external_reuse/{format}/{last
          folder}/{file}. 4. ANON: path contains _anon_ and an underscore data format. If it contains _anon_csr -> {study}/anonymised/primary/{format}/{file}.
          Else take the last \"_\" part of the last folder: if it starts with lowercase ia (case-sensitive, e.g. ia500) ->
          {study}/anonymised/interim/{format}/ia_500/{file}; otherwise (e.g. 20220120) -> {study}/anonymised/other/{format}/20220120/{file}.
          5. CDAR: path contains /cdar/ and a data format. Reporting level = the folder right after the folder named \"ar\"\
          \ (case-insensitive, compared in lowercase). No \"ar\" folder, or reporting level is adam, sdtm or raw -> error.
          csr -> {study}/primary/complete/{format}/{file}. Starts with ia -> remove \"ia\" and any leading \"_\", then add
          \"ia_\" (ia1 -> ia_1, ia_psc -> ia_psc) -> {study}/primary/interim/{format}/{ia_x}/{file}. Anything else (e.g. bdr200)
          -> {study}/primary/other/{format}/bdr200/{file}. 6. OTHERS: path contains /data_reuse/ and a data format, and none
          of /med, /cdap, /idap, /anon, _anon_ -> {study}/other/{format}/{last folder}/{file}. 7. DEFAULT (pass-through):
          path has none of /data_reuse/, _anon_, /cdar/ -> the same path (relative to incoming/, i.e. with incoming/ removed).
          If no rule matches, more than one rule matches, or the target cannot be worked out -> move the file to error/{path
          without incoming/}. Never drop a file. DELIVERY BEHAVIOUR: Move, not copy: copy server-side (files can exceed 5
          GiB), confirm the target exists, then delete the source from incoming/. If the copy or the check fails, leave the
          source in incoming/ so the next run retries it; that file fails. An existing object at the target is overwritten.
          After a successful move, replace all tags on the target with exactly one tag: ADDITIONAL_TAG = the original path
          without incoming/. A tagging failure is only a warning (the file still counts as moved). Files moved to error/ get
          no tag change. Report one line per file: source, target, rule or error reason. The run fails only if a copy, check
          or delete failed. Moving files to error/ does not fail the run.\n"
        examples:
          - name: cdar_csr
            files:
              - d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat
            vars:
              package: sas_incoming
            params: {}
            expected_keys:
              - d0000c00004/primary/complete/adam/a.sas7bdat
            expect_error: false
          - name: cdap_interim
            files:
              - d0000c00004/data_reuse/d000/d0000c00004/ar/shared/raw/dev/data/cdap_20210617_ia300/b.sas7bdat
            vars:
              package: sas_incoming
            params: {}
            expected_keys:
              - d0000c00004/extended_primary_use/interim/raw/ia_300/b.sas7bdat
            expect_error: false
          - name: med_and_others
            files:
              - 04-3077/root/data_reuse/d525/04-3077/med/adam/prod/data/adae.sas7bdat
            vars:
              package: sas_incoming
            params: {}
            expected_keys:
              - 04-3077/external_reuse/adam/data/adae.sas7bdat
            expect_error: false
          - name: anon_other
            files:
              - d0000c00004/d0000c00004_raw_anon_20220120/c.sas7bdat
            vars:
              package: sas_incoming
            params: {}
            expected_keys:
              - d0000c00004/anonymised/other/raw/20220120/c.sas7bdat
            expect_error: false
          - name: default_passthrough
            files:
              - ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf
            vars:
              package: sas_incoming
            params: {}
            expected_keys:
              - ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf
            expect_error: false
          - name: no_rule_matches_to_error
            files:
              - 04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat
            vars:
              package: sas_incoming
            params: {}
            expected_keys:
              - error/04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat
            expect_error: false
          - name: cdar_reporting_level_adam_error
            files:
              - 04-3077/root/cdar/d168/04-3077/ar/adam/prod/data/adae.sas7bdat
            vars:
              package: sas_incoming
            params: {}
            expected_keys:
              - error/04-3077/root/cdar/d168/04-3077/ar/adam/prod/data/adae.sas7bdat
            expect_error: false
  errors: []
  package_name: '{package_key}'
  pipeline_examples:
    - name: cdar_routes
      messages: []
      conf:
      listing:
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat:10
