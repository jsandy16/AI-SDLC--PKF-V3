# pipelines/sas_folder_restructure_wf.lock.yaml — the AI's split of the pipeline requirement.
# Written by `pkf plan pipeline` and `pkf create`. Do not edit by hand.
lock_version: 1
pipeline: sas_folder_restructure_wf
requirement_sha256: dc9172eb8678d89007006b46e9379360ff8fc748dd5c4d6677b3806fb8370146
split:
  summary: A cron schedule (every 45 minutes, starting 2026-10-01, up to 2 retries 2 minutes apart) starts a run with no
    events. The source lists every object under incoming/ in the SAS bucket, drops folder markers, files with no study 
    folder and files with no extension, and makes each remaining file its own package. There is no transformation, so 
    files are never opened or changed. The destination (the same bucket) works out the target key from the folder path 
    using the seven rules (CDAP, IDAP, MED, ANON, CDAR, OTHERS, DEFAULT). If zero or several rules match, or the target 
    can't be worked out, the file goes to error/. Delivery is a server-side copy, then a check, then deleting the 
    source. After a successful move to a study target, the target gets one ADDITIONAL_TAG. One report line is written 
    per file. The run fails only if a copy, check or delete fails.
  components:
    trigger:
      name: sas_folder_restructure_schedule
      reuse: false
      spec:
        api_version: pkf/v1
        kind: trigger
        name: sas_folder_restructure_schedule
        description: from the trigger part of the pipeline requirement
        schedule: '*/45 * * * *'
        connection:
          region: eu-north-1
        params: {}
        requirement: "Run on the cron schedule \"*/45 * * * *\". The schedule starts on 2026-10-01. Each scheduled run produces
          exactly one event, with no messages and no objects. A failed run is retried up to 2 times, 2 minutes apart.\n"
        examples:
          - name: scheduled_run
            messages: []
            conf:
            params: {}
            expected_events:
              - keys: []
                vars: {}
            expect_error: false
    source:
      name: sas_incoming
      reuse: false
      spec:
        api_version: pkf/v1
        kind: source
        name: sas_incoming
        description: from the source part of the pipeline requirement
        type: s3
        connection:
          bucket: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        params: {}
        requirement: "The source is the environment's SAS S3 bucket in region eu-north-1. The bucket name is set per environment
          (development: dev-dpl-dstore-sas-eu-north-1-992382551516). List every object under the prefix incoming/ at any depth,
          recursively. Paths are taken relative to incoming/. Skip silently (do not move, do not report): folder markers (keys
          ending in \"/\"); files directly under incoming/ with no study folder (e.g. incoming/readme.txt); files whose name
          has no \".\" extension. Each remaining file is its own package (one package per file, split by the file's relative
          path, which sets the variable file_key), so a problem with one file does not stop the others. The study ID is the
          first folder after incoming/, used exactly as written (case and hyphens kept). Files are not opened.\n"
        examples:
          - name: normal_files
            event:
            listing:
              - incoming/S1/root/cdar/d000/S1/ar/csr/adam/dev/data/a.sas7bdat:10
              - incoming/04-3077/x/b.sas7bdat:20
            contents: {}
            params: {}
            expected_packages:
              -   - S1/root/cdar/d000/S1/ar/csr/adam/dev/data/a.sas7bdat
              -   - 04-3077/x/b.sas7bdat
            expect_error: false
          - name: skips
            event:
            listing:
              - incoming/S1/folder/:0
              - incoming/readme.txt:10
              - incoming/S1/data/no_extension:5
              - incoming/S1/data/ok.pdf:7
            contents: {}
            params: {}
            expected_packages:
              -   - S1/data/ok.pdf
            expect_error: false
          - name: nothing_to_do
            event:
            listing:
              - incoming/:0
              - incoming/readme.txt:10
            contents: {}
            params: {}
            expected_packages: []
            expect_error: false
    destination:
      name: sas_study_bucket
      reuse: false
      spec:
        api_version: pkf/v1
        kind: destination
        name: sas_study_bucket
        description: from the destination part of the pipeline requirement
        type: s3
        connection:
          bucket: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        delivery:
          if_exists: overwrite
          server_side_encryption:
          write_success_marker: false
        params: {}
        requirement: "The destination is the same S3 bucket as the source (region eu-north-1). Each package is one file whose
          package path is its path relative to incoming/ (the source key is incoming/ + that path). Decide the target key
          from the folder path only (the path relative to incoming/ without the file name). The file name is always kept.
          Study = the first folder of the path, used exactly as written.\n\nData format from the folder path: adam if it contains
          /adam/, otherwise sdtm if it contains /sdtm/, otherwise raw if it contains raw/ (so restricted_raw/ also counts
          as raw). If none of these appears, there is no data format. For anonymised folders the data format comes from _adam_,
          _sdtm_, _raw_ or _restricted_raw_ (= raw). \"Last folder\" = the folder that directly contains the file.\n\nCheck
          every rule below. Exactly one rule must match.\n1. CDAP: path contains /data_reuse/ and /cdap_ and a data format.\n\
          \ - contains /cdap_csr → {study}/extended_primary_use/primary/{format}/{file}\n - else, if the last folder contains
          _ia: take the third \"_\" part of the last folder (cdap_20210617_ia300 → ia300) and write it as ia_ + the rest (ia_300)
          → {study}/extended_primary_use/interim/{format}/ia_300/{file}. Fewer than 3 parts → error.\n - else take the second
          \"_\" part of the last folder (cdap_20210617 → 20210617) → {study}/extended_primary_use/other/{format}/20210617/{file}.
          Fewer than 2 parts → error.\n2. IDAP: path contains /data_reuse/ and /idap and a data format → {study}/internal_reuse/{format}/{last
          folder}/{file}\n3. MED: path contains /data_reuse/ and /med and a data format → {study}/external_reuse/{format}/{last
          folder}/{file}\n4. ANON: path contains _anon_ and an underscore data format.\n - contains _anon_csr → {study}/anonymised/primary/{format}/{file}\n\
          \ - else take the last \"_\" part of the last folder. If it starts with lowercase ia (case-sensitive, e.g. ia500)
          → {study}/anonymised/interim/{format}/ia_500/{file}. Otherwise (e.g. 20220120) → {study}/anonymised/other/{format}/20220120/{file}\n\
          5. CDAR: path contains /cdar/ and a data format.\n - reporting level = the folder right after the folder named \"\
          ar\" (case-insensitive, compared in lowercase)\n - no \"ar\" folder, or the reporting level is adam, sdtm or raw
          → error\n - csr → {study}/primary/complete/{format}/{file}\n - starts with ia → remove \"ia\" and any leading \"\
          _\", then add \"ia_\" (ia1 → ia_1, ia_psc → ia_psc) → {study}/primary/interim/{format}/{ia_x}/{file}\n - anything
          else (e.g. bdr200) → {study}/primary/other/{format}/bdr200/{file}\n6. OTHERS: path contains /data_reuse/ and a data
          format, and none of /med, /cdap, /idap, /anon, _anon_ → {study}/other/{format}/{last folder}/{file}\n7. DEFAULT
          (pass-through): path has none of /data_reuse/, _anon_, /cdar/ → the same path (incoming/ removed)\n\nIf no rule
          matches, more than one rule matches, or the target cannot be worked out → move the file to error/{path without incoming/}.
          Never drop a file.\nWorked examples: incoming/S1/root/cdar/d000/S1/ar/ia100/sdtm/dev/data/x/b.sas7bdat → S1/primary/interim/sdtm/ia_100/b.sas7bdat.
          incoming/S1/root/data_reuse/cdar/d1/S1/ar/csr/adam/prod/data/a.sas7bdat → error/S1/root/data_reuse/cdar/d1/S1/ar/csr/adam/prod/data/a.sas7bdat
          (CDAR and OTHERS both match).\n\nDELIVERY BEHAVIOUR\n- Move, not copy: copy the file server-side (files can be larger
          than 5 GiB), confirm the target exists, then delete the source from incoming/. This also applies to files moved
          to error/.\n- If the copy or the check fails, leave the source in incoming/ so the next run retries it. That file
          fails.\n- An existing object at the target is overwritten.\n- After a successful move to a study target, replace
          all tags on the target with exactly one tag: ADDITIONAL_TAG = the original path without incoming/. A tagging failure
          is only a warning, and the file still counts as moved.\n- Files moved to error/ get no tag change.\n- Report one
          line per file: source, target, and the rule or the error reason.\n- The run fails only if a copy, check or delete
          failed. Moving files to error/ does not fail the run.\n"
        examples:
          - name: cdar_interim
            files:
              - S1/root/cdar/d000/S1/ar/ia100/sdtm/dev/data/x/b.sas7bdat
            vars:
              package: S1/root/cdar/d000/S1/ar/ia100/sdtm/dev/data/x/b.sas7bdat
            params: {}
            expected_keys:
              - S1/primary/interim/sdtm/ia_100/b.sas7bdat
            expect_error: false
          - name: cdap_interim
            files:
              - d0000c00004/data_reuse/d000/d0000c00004/ar/shared/raw/dev/data/cdap_20210617_ia300/b.sas7bdat
            vars:
              package: x
            params: {}
            expected_keys:
              - d0000c00004/extended_primary_use/interim/raw/ia_300/b.sas7bdat
            expect_error: false
          - name: anon_other
            files:
              - d0000c00004/d0000c00004_raw_anon_20220120/c.sas7bdat
            vars:
              package: x
            params: {}
            expected_keys:
              - d0000c00004/anonymised/other/raw/20220120/c.sas7bdat
            expect_error: false
          - name: default_passthrough
            files:
              - ABCD-0000-0000/Export_Inventory.pdf
            vars:
              package: x
            params: {}
            expected_keys:
              - ABCD-0000-0000/Export_Inventory.pdf
            expect_error: false
          - name: two_rules_match_goes_to_error
            files:
              - 04-3077/root/data_reuse/cdar/d168/04-3077/ar/csr/adam/prod/data/adae.sas7bdat
            vars:
              package: x
            params: {}
            expected_keys:
              - error/04-3077/root/data_reuse/cdar/d168/04-3077/ar/csr/adam/prod/data/adae.sas7bdat
            expect_error: false
  errors: []
  package_name: '{file_key}'
  pipeline_examples:
    - name: cdar_routes
      messages: []
      conf:
      listing:
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat:10
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/ia100/sdtm/dev/data/data_area/b.sas7bdat:10
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/bdr200/raw/dev/data/data_area/c.sas7bdat:10
      params: {}
      expected_keys:
        - d0000c00004/primary/complete/adam/a.sas7bdat
        - d0000c00004/primary/interim/sdtm/ia_100/b.sas7bdat
        - d0000c00004/primary/other/raw/bdr200/c.sas7bdat
      expect_error: false
    - name: default_errors_and_skips
      messages: []
      conf:
      listing:
        - incoming/ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf:10
        - incoming/04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat:10
        - incoming/readme.txt:10
        - incoming/04-3077/root/data_reuse/d525/04-3077/shared/adam/prod/data/no_extension:10
      params: {}
      expected_keys:
        - ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf
        - error/04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat
      expect_error: false
  assumptions:
    - The schedule start date (2026-10-01) and the retry policy (2 retries, 2 minutes apart) are described in the 
      trigger requirement, because the trigger settings have no keys for them.
    - 'One package per file: the source splits by relative path and sets the variable file_key, which is used as the package
      name.'
    - The bucket name is set per environment, so the config holds <REQUIRED>. The development value is given in the 
      source requirement.
    - 'Delivery overwrites existing target objects (if_exists: overwrite) and is done by a custom_delivery step (move, check,
      tag).'
    - Source and destination are the same bucket, with no transformation step.
  ambiguities: []
  to_fill_in:
    - destination.connection.bucket
    - source.connection.bucket
owned:
  -   - connection
      - sas_folder_restructure_wf_connection
  -   - destination
      - sas_study_bucket
  -   - source
      - sas_incoming
  -   - trigger
      - sas_folder_restructure_schedule
