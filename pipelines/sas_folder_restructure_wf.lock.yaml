        - error/04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat
        - error/04-3077/root/data_reuse/cdar/d168/04-3077/ar/csr/adam/prod/data/adae.sas7bdat
        - error/04-3077/root/cdar/d168/04-3077/adam/prod/data/adae.sas7bdat
      expect_error: false
  assumptions:
    - 'Retry settings are passed as strings in trigger params: retries "2" and retry_delay_seconds "120".'
    - The source's per-file split sets the variable package_key (the relative path), which the package name uses.
    - Source and destination use the same bucket, which is "<REQUIRED>" because it is set per environment.
    - Skipped files (folder markers, no study folder, no extension) stay in incoming/ and are not reported.
    - The listing keys keep the incoming/ prefix, and package paths are relative to incoming/.
