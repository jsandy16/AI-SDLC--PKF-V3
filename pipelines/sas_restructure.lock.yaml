# pipelines/sas_restructure.lock.yaml — the AI's split of the pipeline requirement.
# Written by `pkf plan pipeline` and `pkf create`. Do not edit by hand.
lock_version: 1
pipeline: sas_restructure
requirement_sha256: e32967c1a996033a2633940c891901f3538ceb35380812a886d73b45441e2de4
split:
  summary: A cron schedule fires every 45 minutes and starts a run with no events. The source lists every object under 
    incoming/ in the SAS S3 bucket. It skips folder markers, files directly under incoming/ and files with no extension.
    Each remaining file becomes its own package, with paths relative to incoming/. Files are not transformed. The 
    destination applies the seven routing rules to the folder path to pick the target key, or error/{path} when no rule 
    or several rules match. It then moves the file within the same bucket with a server-side copy, an existence check 
    and deletion of the source. After a successful move it replaces the target's tags with ADDITIONAL_TAG, and it writes
    one report line per file. The run fails only if a copy, check or delete fails.
  components:
    trigger:
      name: sas_restructure_schedule
      reuse: false
      spec:
        api_version: pkf/v1
        kind: trigger
        name: sas_restructure_schedule
        description: from the trigger part of the pipeline requirement
        schedule: '*/45 * * * *'
        connection:
          region: eu-north-1
        params: {}
        requirement: "Run on the cron schedule \"*/45 * * * *\". Each run produces one event and has no messages. A failed
          run is retried 2 times, 2 minutes apart.\n"
        examples:
          - name: scheduled_run
            messages: []
            conf:
            params: {}
            expected_events:
              - keys: []
                vars: {}
            expect_error: false
    source:
      name: sas_incoming
      reuse: false
      spec:
        api_version: pkf/v1
        kind: source
        name: sas_incoming
        description: from the source part of the pipeline requirement
        type: s3
        connection:
          bucket: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        params: {}
        requirement: "The source is the environment's SAS S3 bucket in region eu-north-1. List every object under the prefix
          incoming/ at any depth, with paths taken relative to incoming/. Skip silently, without moving or reporting them:
          folder markers (keys ending in \"/\"), files directly under incoming/ with no study folder (e.g. incoming/readme.txt),
          and files whose name has no \".\" extension. Each remaining file is its own package, so a problem with one file
          does not stop the others. The study ID is the first folder after incoming/, used exactly as written.\n"
        examples:
          - name: one_package_per_file
            event:
            listing:
              - incoming/S-001/a/x.sas7bdat:10
              - incoming/S-001/b/y.sas7bdat:20
            contents: {}
            params: {}
            expected_packages:
              -   - S-001/a/x.sas7bdat
              -   - S-001/b/y.sas7bdat
            expect_error: false
          - name: skips
            event:
            listing:
              - incoming/S-001/:0
              - incoming/readme.txt:10
              - incoming/S-001/a/no_extension:10
              - incoming/S-001/a/x.sas7bdat:10
            contents: {}
            params: {}
            expected_packages:
              -   - S-001/a/x.sas7bdat
            expect_error: false
          - name: deep_path
            event:
            listing:
              - incoming/99-0001/root/cdar/d168/99-0001/ar/csr/adam/prod/data/adae.sas7bdat:10
            contents: {}
            params: {}
            expected_packages:
              -   - 99-0001/root/cdar/d168/99-0001/ar/csr/adam/prod/data/adae.sas7bdat
            expect_error: false
    destination:
      name: sas_restructure_destination
      reuse: false
      spec:
        api_version: pkf/v1
        kind: destination
        name: sas_restructure_destination
        description: from the destination part of the pipeline requirement
        type: s3
        connection:
          bucket: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        delivery:
          if_exists: skip_identical
          server_side_encryption:
          write_success_marker: false
        params: {}
        requirement: "Source and destination are the same S3 bucket (eu-north-1). Files are never opened, renamed or changed;
          only their location changes. Each package is one file whose package path is its path relative to incoming/ (the
          first folder is the study ID, used exactly as written). The target is decided from the folder path only (the path
          relative to incoming/ without the file name). The file name is always kept. Data format (slash format) from the
          folder path: adam if it contains /adam/, otherwise sdtm if it contains /sdtm/, otherwise raw if it contains raw/
          (so restricted_raw/ also counts as raw). For anonymised folders the data format (underscore format) comes from _adam_,
          _sdtm_, _raw_ or _restricted_raw_ (= raw). 'Last folder' = the folder that directly contains the file. Every rule
          below is checked. Exactly one rule must match. 1. CDAP: path contains /data_reuse/ and /cdap_ and a data format.
          If it contains /cdap_csr -> {study}/extended_primary_use/primary/{format}/{file}. Else if the last folder contains
          _ia -> take the third '_' part of the last folder (cdap_20210617_ia300 -> ia300), write it as ia_ + the rest (ia_300)
          -> {study}/extended_primary_use/interim/{format}/ia_300/{file}; fewer than 3 parts -> error. Else -> second '_'
          part of the last folder (cdap_20210617 -> 20210617) -> {study}/extended_primary_use/other/{format}/20210617/{file};
          fewer than 2 parts -> error. 2. IDAP: path contains /data_reuse/ and /idap and a data format -> {study}/internal_reuse/{format}/{last
          folder}/{file}. 3. MED: path contains /data_reuse/ and /med and a data format -> {study}/external_reuse/{format}/{last
          folder}/{file}. 4. ANON: path contains _anon_ and an underscore data format. If it contains _anon_csr -> {study}/anonymised/primary/{format}/{file}.
          Else take the last '_' part of the last folder: if it starts with lowercase ia, case-sensitive (ia500) -> {study}/anonymised/interim/{format}/ia_500/{file};
          otherwise (20220120) -> {study}/anonymised/other/{format}/20220120/{file}. 5. CDAR: path contains /cdar/ and a data
          format. Reporting level = the folder right after the folder named 'ar' (case-insensitive, compared in lowercase).
          No 'ar' folder, or the reporting level is adam, sdtm or raw -> error. csr -> {study}/primary/complete/{format}/{file}.
          Starts with ia -> remove 'ia' and any leading '_', then add 'ia_' (ia1 -> ia_1, ia_psc -> ia_psc) -> {study}/primary/interim/{format}/{ia_x}/{file}.
          Anything else (bdr200) -> {study}/primary/other/{format}/bdr200/{file}. 6. OTHERS: path contains /data_reuse/ and
          a data format, and none of /med, /cdap, /idap, /anon, _anon_ -> {study}/other/{format}/{last folder}/{file}. 7.
          DEFAULT (pass-through): path has none of /data_reuse/, _anon_, /cdar/ -> the same path (incoming/ removed). No rule
          matches, more than one rule matches, or the target cannot be worked out -> the file moves to error/{path without
          incoming/}. A file is never dropped. Examples: incoming/S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat
          -> S-001/primary/complete/adam/a.sas7bdat; incoming/S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat (no 'ar'
          folder) -> error/S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat. DELIVERY BEHAVIOUR: Move, not copy: copy
          server-side (files can be larger than 5 GiB), confirm the target exists, then delete the source from incoming/.
          If the copy or the check fails, the source stays in incoming/ so the next run retries it; that file fails. An existing
          object at the target is overwritten. After a successful move, all tags on the target are replaced with exactly one
          tag: ADDITIONAL_TAG = the original path without incoming/. A tagging failure is only a warning (the file still counts
          as moved). Files moved to error/ get no tag change. One report line per file: source, target, rule or error reason.
          The run fails only if a copy, check or delete failed. Moving files to error/ does not fail the run.\n"
        examples:
          - name: cdar_csr
            files:
              - S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat
            vars:
              package: S-001/root/cdar/d000/S-001/ar/csr/adam/dev/data/a.sas7bdat
            params: {}
            expected_keys:
              - S-001/primary/complete/adam/a.sas7bdat
            expect_error: false
          - name: cdar_without_ar_goes_to_error
            files:
              - S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat
            vars:
              package: S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat
            params: {}
            expected_keys:
              - error/S-001/root/cdar/d000/S-001/adam/prod/data/b.sas7bdat
            expect_error: false
          - name: cdap_interim
            files:
              - d0000c00004/data_reuse/d000/d0000c00004/ar/shared/raw/dev/data/cdap_20210617_ia300/b.sas7bdat
            vars:
              package: x
            params: {}
            expected_keys:
              - d0000c00004/extended_primary_use/interim/raw/ia_300/b.sas7bdat
            expect_error: false
          - name: anon_other
            files:
              - d0000c00004/d0000c00004_raw_anon_20220120/c.sas7bdat
            vars:
              package: x
            params: {}
            expected_keys:
              - d0000c00004/anonymised/other/raw/20220120/c.sas7bdat
            expect_error: false
          - name: default_passthrough
            files:
              - ABCD-0000-0000/Export_Inventory_2024-03-01.pdf
            vars:
              package: x
            params: {}
            expected_keys:
              - ABCD-0000-0000/Export_Inventory_2024-03-01.pdf
            expect_error: false
  errors: []
  package_name: '{source}_{ds_nodash}'
  pipeline_examples:
    - name: cdar_routes
      messages: []
      conf:
      listing:
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat:10
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/ia100/sdtm/dev/data/data_area/b.sas7bdat:10
        - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/bdr200/raw/dev/data/data_area/c.sas7bdat:10
      params: {}
      expected_keys:
        - d0000c00004/primary/complete/adam/a.sas7bdat
        - d0000c00004/primary/interim/sdtm/ia_100/b.sas7bdat
        - d0000c00004/primary/other/raw/bdr200/c.sas7bdat
      expect_error: false
    - name: default_errors_and_skips
      messages: []
      conf:
      listing:
        - incoming/ABCD-0000-0000/Export_Inventory_2024-03-01.pdf:10
        - incoming/99-0001/root/data_reuse/d525/99-0001/shared/prod/data/adae.sas7bdat:10
        - incoming/99-0001/root/cdar/d168/99-0001/adam/prod/data/adae.sas7bdat:10
        - incoming/readme.txt:10
        - incoming/99-0001/root/data_reuse/d525/99-0001/shared/adam/prod/data/no_extension:10
      params: {}
      expected_keys:
        - ABCD-0000-0000/Export_Inventory_2024-03-01.pdf
        - error/99-0001/root/data_reuse/d525/99-0001/shared/prod/data/adae.sas7bdat
        - error/99-0001/root/cdar/d168/99-0001/adam/prod/data/adae.sas7bdat
      expect_error: false
  assumptions:
    - The source and destination bucket name is environment-specific and left as <REQUIRED>.
    - Each file is its own package, so the package_name template is only a placeholder. The files are moved by the 
      custom delivery, not packaged.
    - Retry (2 times, 2 minutes apart) is described in the trigger requirement because the settings have no key for it.
    - Anything the catalogue cannot express (routing rules, move, tagging, report) is built by the destination planner 
      as a custom_delivery step.
  ambiguities: []
  to_fill_in:
    - destination.connection.bucket
    - source.connection.bucket
owned:
  -   - connection
      - sas_restructure_connection
  -   - destination
      - sas_restructure_destination
  -   - source
      - sas_incoming
  -   - trigger
      - sas_restructure_schedule
