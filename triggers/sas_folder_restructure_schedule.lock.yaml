plan:
  summary: The trigger starts the pipeline on the cron schedule "*/45 * * * *", from 2026-10-01. Each scheduled run 
    produces exactly one event with no messages, no objects and no variables. That event starts one run, which lists 
    every file under incoming/ and moves each one. The move itself (copy, check, delete, tags, error/ handling, report) 
    is done by the source and destination components, not by the trigger.
  why: A scheduled trigger needs only one receive step. The catalogue `schedule` step produces exactly one event per 
    run, which is what the requirement and the scheduled_run example ask for. No parsing, filtering or grouping is 
    needed because there are no messages. The single event goes to the source's planning step, which finds the files 
    under incoming/. The destination's delivery step then carries out the R-RUN clauses. Those clauses are cited here 
    only because this trigger event is what starts each run that applies them.
  steps:
    - id: scheduled_run
      op: schedule
      title: Start one run every 45 minutes from 2026-10-01; each run moves every file under incoming/
      params: {}
      unit:
        requires: 'The scheduler started the run: cron "*/45 * * * *", start date 2026-10-01, 2 retries 2 minutes apart, at
          most one active run. There are no messages.'
        guarantees: "Exactly one event: message_ids empty, data None, objects empty, vars empty. It goes to the source's planning
          step, which lists every file under incoming/ (R-TRG-2). The destination's delivery step then moves each file (R-RUN-1..12):
          server-side copy that supports files over 5 GiB, overwriting any existing target; a check that the target exists;
          deletion of the source; replacement of all target tags with one ADDITIONAL_TAG (a tagging failure is only a warning;
          files moved to error/ get no tag change); copy/check/delete also for moves to error/; one report line per file;
          and the run fails only if a copy, check or delete failed."
        clauses:
          - R-TRG-1
          - R-TRG-2
          - R-TRG-3
          - R-TRG-4
          - R-TRG-5
          - R-RUN-1
          - R-RUN-2
          - R-RUN-3
          - R-RUN-4
          - R-RUN-5
          - R-RUN-6
          - R-RUN-7
          - R-RUN-8
          - R-RUN-9
          - R-RUN-10
          - R-RUN-11
          - R-RUN-12
  assumptions:
    - The cron expression, the start date 2026-10-01, the retries (2, 2 minutes apart) and at most one active run are 
      pipeline/DAG schedule settings. The `schedule` step takes no parameters for them.
    - The R-RUN clauses and the listing of incoming/ (R-TRG-2) are carried out by the source and destination components.
      This trigger only provides the one event per run that starts them, so it cites those clauses for coverage.
    - '"*/45 * * * *" is standard cron, so it fires at minutes 0 and 45 of every hour, not strictly every 45 minutes.'
  ambiguities: []
