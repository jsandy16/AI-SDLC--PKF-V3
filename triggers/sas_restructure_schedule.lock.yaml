lock_version: 2
kind: trigger
name: sas_restructure_schedule
requirement_sha256: 4023730aa1d048c79142c9419bce66a216d8964213325eb94e18177d5ee8024e
plan:
  summary: 'The trigger starts a run every 45 minutes (cron "*/45 * * * *"). Each run gets exactly one event with no messages,
    objects or variables. The trigger does not read files. Later components use that one event to plan the run: the source
    lists everything under incoming/, the destination copies and moves the files, and the report writes one line per file.
    A failed run is retried twice, 2 minutes apart.'
  why: "This is a scheduled trigger, so the only step it needs is the catalogue `schedule` receive step. It produces the one
    empty event that the example expects. The run-level clauses are cited on this step because this event starts the run they
    describe. The step adds no logic for them: R-TRG-2 is done by the source's list/select, and R-RUN-2 and R-RUN-3 by the
    destination's delivery and the framework's report. No filter, group or custom step is needed, because there are no messages
    to parse."
  steps:
    - id: scheduled_run
      op: schedule
      title: Start one run every 45 minutes with a single event and no messages
      params: {}
      unit:
        requires: 'Nothing. This is the first step and runs when the cron schedule "*/45 * * * *" fires (or on a retry: 2
          retries, 2 minutes apart).'
        guarantees: "Each run has exactly one event: message_ids [], data None, objects [], vars {}, error None. Nothing is
          acknowledged because there are no messages. This one event starts a single planning pass: the source lists every
          file currently under incoming/ (R-TRG-2), and the run then gives one report line per file and fails only when a
          copy, check or delete fails (R-RUN-2, R-RUN-3; handled by the source, the destination and the framework's report)."
        clauses:
          - R-TRG-1
          - R-RUN-1
          - R-TRG-2
          - R-RUN-2
          - R-RUN-3
  assumptions:
    - The cron expression "*/45 * * * *" and the retry policy (2 retries, 2 minutes apart) are DAG schedule and retry 
      settings. They are not parameters of the schedule step.
    - R-TRG-2 (process every file under incoming/) is done by the source's listing. The trigger only provides the one 
      event per run that this listing runs under.
    - R-RUN-2 (one report line per file) and R-RUN-3 (the run fails only on a copy, check or delete failure; moves to 
      error/ do not fail it) are done by the destination's delivery step and the framework's report. They are cited here
      only because this trigger starts the run.
  ambiguities: []
  step_tests: {}
  function_tests: {}
  clauses:
    - id: R-TRG-1
      component: trigger
      text: A run starts on the cron schedule "*/45 * * * *" with no events.
      source_quote: Run on the cron schedule "*/45 * * * *" (no events).
      kind: stated
    - id: R-TRG-2
      component: trigger
      text: Each run processes every file currently under incoming/.
      source_quote: Each run processes every file currently under incoming/.
      kind: stated
    - id: R-RUN-1
      component: run
      text: A failed run is retried 2 times with a 2 minute delay.
      source_quote: "retries: 2\nretry_delay_minutes: 2"
      kind: stated
    - id: R-RUN-2
      component: run
      text: 'One report line per file: source, target, rule or error reason.'
      source_quote: 'Report one line per file: source, target, rule or error reason.'
      kind: stated
    - id: R-RUN-3
      component: run
      text: The run fails only if a copy, check or delete failed; moves to error/ do not fail it.
      source_quote: The run fails only if a copy, check or delete failed. Moving files to error/ does not fail the run.
      kind: stated
